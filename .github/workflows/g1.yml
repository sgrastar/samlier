# G1 gate.
#
# ★ The final trust anchor for the approval protocol is this workflow definition.
#   Protect .github/ with CODEOWNERS + branch protection.
#   If this can be rewritten, the entire gate can be disabled.
#
# Pin Actions to **complete commit SHAs**, not mutable tags.
name: G1

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- g1Check
  # Does not access source text at all. validator's --structural-only runs only the target rules
  # and uses its exit code as-is (do not write an exclusion list on the CI side).
  g1-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683   # v4.2.2
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with: { python-version: '3.12' }
      - name: deps (hash-pinned)
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --require-hashes -r tools/requirements.lock
      - name: Check that docs/04 matches coverage.yaml
        run: .venv/bin/python tools/g1_docgen.py --check
      - name: Structural validation
        run: |
          set -euo pipefail
          # ★ Do not hide a validator crash with an old report.
          rm -f build/spec-reconcile-report.json
          .venv/bin/python tools/g1_validate.py --structural-only
          # Confirm that the report was generated by this run.
          test -f build/spec-reconcile-report.json
          .venv/bin/python - <<'PY'
          import json,sys
          r=json.load(open('build/spec-reconcile-report.json'))
          assert r['mode']=='structural-only', r['mode']
          print('checks:',r['totals']['checks'],'blocking:',r['totals']['blocking_failures'])
          sys.exit(1 if r['totals']['blocking_failures'] else 0)
          PY

  # ------------------------------------------------------------ specReconcile
  spec-reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683   # v4.2.2
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with: { python-version: '3.12' }
      - name: deps (hash-pinned)
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --require-hashes -r tools/requirements.lock
      - name: Force-fetch and reconcile source text and all referenced specifications
        run: |
          set -euo pipefail
          rm -f build/spec-reconcile-report.json
          .venv/bin/python tools/g1_validate.py
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        if: always()
        with: { name: spec-reconcile-report, path: build/spec-reconcile-report.json }

  # ------------------------------------------------------------------- G1b
  # Validate signed approval.
  #
  # ★ **Do not add a job condition**. A job skipped by a condition is treated as
  #   Success by GitHub and does not block merging even when made a required check.
  #   The gate could be disabled simply by deleting the variable.
  #
  #   This job always runs and **fails** if approval is not complete.
  #   Before G1b, this job being red is the correct state;
  #   **whether to make it a required check is switched on the branch-protection side**
  #   (do not put the lifecycle switch in a job condition).
  #
  # ★ Do not execute any code from the current branch before signature verification.
  #   Dependencies, the runner, and the validator are all extracted from G1_TOOLS_COMMIT.
  g1b-approval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683   # v4.2.2
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with: { python-version: '3.12' }

      - name: Validate G1_TOOLS_COMMIT (fail if unset)
        env:
          G1_TOOLS_COMMIT: ${{ vars.G1_TOOLS_COMMIT }}
        run: |
          set -euo pipefail
          [[ -n "${G1_TOOLS_COMMIT:-}" ]] || {
            echo "G1_TOOLS_COMMIT is not set."
            echo "Before G1b is complete, this job failing is the correct state."
            echo "Make it a required check only after G1b is complete (switch on the branch-protection side)."
            exit 2; }
          [[ "$G1_TOOLS_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "Only a complete 40-digit SHA is accepted"; exit 2; }
          [[ "$(git rev-parse --verify --quiet "${G1_TOOLS_COMMIT}^{commit}")" == "$G1_TOOLS_COMMIT" ]] \
            || { echo "Cannot resolve an exact match as a commit"; exit 2; }

      - name: Extract dependencies from G1_TOOLS_COMMIT and install with hashes pinned
        env:
          G1_TOOLS_COMMIT: ${{ vars.G1_TOOLS_COMMIT }}
        run: |
          set -euo pipefail
          # ★ Do not use tools/requirements.* from the current branch.
          #   Adding an arbitrary package, URL, or local build to unprotected requirements
          #   would execute arbitrary code before signature verification.
          mkdir -p /tmp/pin
          git show "$G1_TOOLS_COMMIT:tools/requirements.lock" > /tmp/pin/requirements.lock
          python3 -m venv /tmp/pin/venv
          /tmp/pin/venv/bin/pip install --require-hashes -r /tmp/pin/requirements.lock

      - name: Signature-key allowlist
        env:
          # ★ Do not expand ${{ }} directly into the run script (this causes script injection).
          #   Pass it through env and reference it quoted on the shell side.
          G1_ALLOWED_SIGNERS: ${{ vars.G1_ALLOWED_SIGNERS }}
        run: |
          set -euo pipefail
          printf '%s\n' "$G1_ALLOWED_SIGNERS" > /tmp/allowed_signers
          test -s /tmp/allowed_signers || { echo "G1_ALLOWED_SIGNERS is empty"; exit 2; }
          git config gpg.format ssh
          git config gpg.ssh.allowedSignersFile /tmp/allowed_signers

      - name: Validate approval (extract the runner from the pinned SHA and run it in isolation)
        env:
          G1_TOOLS_COMMIT: ${{ vars.G1_TOOLS_COMMIT }}
          G1_SIGNER_MAP: ${{ vars.G1_SIGNER_MAP }}
        run: |
          set -euo pipefail
          # ★ Do not call tools/g1_ci_verify.sh. Since the wrapper itself can be modified,
          #   expanding the equivalent process in this workflow is the trust anchor.
          rm -f build/spec-reconcile-report.json
          TMP=$(mktemp -d); mkdir -p "$TMP/tools"
          for f in tools/g1_trusted_verify.py tools/g1_validate.py tools/g1_extract.py; do
            git show "$G1_TOOLS_COMMIT:$f" > "$TMP/$f"
          done
          env -u PYTHONPATH -u G1_VALIDATOR_COMMIT -u G1_RUNNER_COMMIT \
              G1_REPO_ROOT="$PWD" \
              G1_RUNNER_COMMIT="$G1_TOOLS_COMMIT" \
              G1_VALIDATOR_COMMIT="$G1_TOOLS_COMMIT" \
              G1_SIGNER_MAP="${G1_SIGNER_MAP:-}" \
              /tmp/pin/venv/bin/python -I "$TMP/tools/g1_trusted_verify.py"

      - name: Check g1.complete and provenance
        env:
          G1_TOOLS_COMMIT: ${{ vars.G1_TOOLS_COMMIT }}
        run: |
          set -euo pipefail
          test -f build/spec-reconcile-report.json
          /tmp/pin/venv/bin/python - <<'PY'
          import json,os,sys
          r=json.load(open('build/spec-reconcile-report.json'))
          g1,pv=r['g1'],r['provenance']
          pin=os.environ['G1_TOOLS_COMMIT']
          ok = (g1['complete']
                and pv['validator_source_kind']=='external-pin'
                and pv['validator_source']==pin
                and pv['runner_source']==pin)
          print(json.dumps({'complete':g1['complete'],**pv},ensure_ascii=False,indent=1))
          sys.exit(0 if ok else 1)
          PY

      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        if: always()
        with: { name: g1b-approval-report, path: build/spec-reconcile-report.json }
