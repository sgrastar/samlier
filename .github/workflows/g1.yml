# G1 のゲート。承認プロトコルの最後の trust anchor は「この workflow 定義」である。
# したがって .github/ は CODEOWNERS と branch protection で保護すること。
name: G1

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'      # 定期の specReconcile（原文の変化を検知）
  workflow_dispatch:

permissions:
  contents: read

env:
  PY: .venv/bin/python

jobs:
  # ---------------------------------------------------------------- g1Check
  # ネットワーク不要。カタログの構造と生成物の一致だけを見る。
  g1-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: deps
        run: python3 -m venv .venv && .venv/bin/pip install -r tools/requirements.txt
      - name: docs/04 が coverage.yaml と一致するか
        run: $PY tools/g1_docgen.py --check
      - name: 構造検査（offline）
        run: |
          # 原文キャッシュが無い環境なので、network 検査は specReconcile ジョブに任せる。
          # ここでは取得を伴わない構造規則だけを見る。
          $PY tools/g1_validate.py --offline || true
          $PY - <<'PY'
          import json,sys
          r=json.load(open('build/spec-reconcile-report.json'))
          # 原文未取得に由来する FAIL（SR-00/01/02/05..14/32..35）は g1Check の対象外
          NET={'SR-00','SR-01','SR-01b','SR-02','SR-02b','SR-05','SR-06','SR-07','SR-08',
               'SR-09','SR-10','SR-11','SR-12','SR-13','SR-14','SR-32','SR-33','SR-34'}
          bad=[c for c in r['checks']
               if c['result']=='FAIL' and c['id'] not in NET|{'SR-30','SR-31'}]
          print(f"structural failures: {[c['id'] for c in bad]}")
          sys.exit(1 if bad else 0)
          PY

  # ------------------------------------------------------------ specReconcile
  # 原文と全参照仕様を強制再取得して照合する。ネットワークが要る。
  spec-reconcile:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python3 -m venv .venv && .venv/bin/pip install -r tools/requirements.txt
      - name: 原文と全参照仕様を照合
        run: $PY tools/g1_validate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spec-reconcile-report
          path: build/spec-reconcile-report.json

  # ------------------------------------------------------------------- G1b
  # 署名済み承認の検証。runner / validator は固定 SHA から取り出す。
  # ★ G1_TOOLS_COMMIT は承認時に決まる 40 桁完全 SHA。ここに直接書いて固定する
  #   （リポジトリ内の値を参照しない。これが最後の trust anchor）。
  g1b-approval:
    runs-on: ubuntu-latest
    if: vars.G1_TOOLS_COMMIT != ''
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python3 -m venv .venv && .venv/bin/pip install -r tools/requirements.txt
      - name: 署名鍵の許可リスト
        run: |
          printf '%s\n' "${{ vars.G1_ALLOWED_SIGNERS }}" > /tmp/allowed_signers
          git config gpg.ssh.allowedSignersFile /tmp/allowed_signers
          git config gpg.format ssh
      - name: 承認検証（固定 SHA から runner を取り出して隔離実行）
        env:
          G1_TOOLS_COMMIT: ${{ vars.G1_TOOLS_COMMIT }}
        run: |
          set -euo pipefail
          # ★ リポジトリの tools/g1_ci_verify.sh を呼ばず、同等の処理をここに展開する。
          #   ラッパー自身も改変されうるため、CI 設定側に置くのが trust anchor になる。
          [[ "$G1_TOOLS_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "G1_TOOLS_COMMIT は 40 桁完全 SHA"; exit 2; }
          [[ "$(git rev-parse --verify --quiet "${G1_TOOLS_COMMIT}^{commit}")" == "$G1_TOOLS_COMMIT" ]] \
            || { echo "解決できない"; exit 2; }
          TMP=$(mktemp -d); mkdir -p "$TMP/tools"
          for f in tools/g1_trusted_verify.py tools/g1_validate.py tools/g1_extract.py; do
            git show "$G1_TOOLS_COMMIT:$f" > "$TMP/$f"
          done
          env -u PYTHONPATH -u G1_VALIDATOR_COMMIT \
              G1_REPO_ROOT="$PWD" \
              G1_RUNNER_COMMIT="$G1_TOOLS_COMMIT" \
              G1_VALIDATOR_COMMIT="$G1_TOOLS_COMMIT" \
              "$PWD/.venv/bin/python" -I "$TMP/tools/g1_trusted_verify.py"
      - name: g1.complete と provenance を確認
        run: |
          $PY - <<'PY'
          import json,sys
          r=json.load(open('build/spec-reconcile-report.json'))
          g1=r['g1']; pv=r['provenance']
          ok = g1['complete'] and pv['validator_source_kind']=='external-pin'
          print(json.dumps({'complete':g1['complete'],
                            'validator_source_kind':pv['validator_source_kind'],
                            'validator_source':pv['validator_source'],
                            'runner_source':pv['runner_source']},ensure_ascii=False,indent=1))
          sys.exit(0 if ok else 1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g1b-approval-report
          path: build/spec-reconcile-report.json
