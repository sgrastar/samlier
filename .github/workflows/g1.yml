# G1 のゲート。
#
# ★ 承認プロトコルの最後の trust anchor は「この workflow 定義」である。
#   .github/ は CODEOWNERS + branch protection で保護すること。
#   ここを書き換えられればゲート全体が無効になる。
#
# Actions は可変タグではなく **完全 commit SHA** で固定する。
name: G1

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- g1Check
  # 原文を一切参照しない。validator の --structural-only が対象規則だけを実行し、
  # その終了コードをそのまま使う（CI 側に除外リストを書かない）。
  g1-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683   # v4.2.2
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with: { python-version: '3.12' }
      - name: deps（hash 固定）
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --require-hashes -r tools/requirements.lock
      - name: docs/04 が coverage.yaml と一致するか
        run: .venv/bin/python tools/g1_docgen.py --check
      - name: 構造検査
        run: |
          set -euo pipefail
          # ★ 古いレポートで validator のクラッシュを隠さない
          rm -f build/spec-reconcile-report.json
          .venv/bin/python tools/g1_validate.py --structural-only
          # レポートが今回の実行で生成されたことを確認する
          test -f build/spec-reconcile-report.json
          .venv/bin/python - <<'PY'
          import json,sys
          r=json.load(open('build/spec-reconcile-report.json'))
          assert r['mode']=='structural-only', r['mode']
          print('checks:',r['totals']['checks'],'blocking:',r['totals']['blocking_failures'])
          sys.exit(1 if r['totals']['blocking_failures'] else 0)
          PY

  # ------------------------------------------------------------ specReconcile
  spec-reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683   # v4.2.2
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with: { python-version: '3.12' }
      - name: deps（hash 固定）
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --require-hashes -r tools/requirements.lock
      - name: 原文と全参照仕様を強制再取得して照合
        run: |
          set -euo pipefail
          rm -f build/spec-reconcile-report.json
          .venv/bin/python tools/g1_validate.py
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        if: always()
        with: { name: spec-reconcile-report, path: build/spec-reconcile-report.json }

  # ------------------------------------------------------------------- G1b
  # 署名済み承認の検証。
  #
  # ★ fail-open を避けるため、G1B_ENABLED が true なら **常に実行し、
  #   変数が未設定なら失敗する**。「変数がなければ skip」は required check として
  #   fail-open になる。
  #
  # ★ 署名検証より前に、現在ブランチのコードを一切実行しない。
  #   依存も runner も validator も G1_TOOLS_COMMIT から取り出す。
  g1b-approval:
    runs-on: ubuntu-latest
    if: vars.G1B_ENABLED == 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683   # v4.2.2
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with: { python-version: '3.12' }

      - name: G1_TOOLS_COMMIT の検証（未設定なら失敗）
        env:
          G1_TOOLS_COMMIT: ${{ vars.G1_TOOLS_COMMIT }}
        run: |
          set -euo pipefail
          [[ -n "${G1_TOOLS_COMMIT:-}" ]] || { echo "G1B_ENABLED=true なのに G1_TOOLS_COMMIT が未設定"; exit 2; }
          [[ "$G1_TOOLS_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "40 桁完全 SHA のみ"; exit 2; }
          [[ "$(git rev-parse --verify --quiet "${G1_TOOLS_COMMIT}^{commit}")" == "$G1_TOOLS_COMMIT" ]] \
            || { echo "commit として完全一致で解決できない"; exit 2; }

      - name: 依存を G1_TOOLS_COMMIT から取り出して hash 固定でインストール
        env:
          G1_TOOLS_COMMIT: ${{ vars.G1_TOOLS_COMMIT }}
        run: |
          set -euo pipefail
          # ★ 現在ブランチの tools/requirements.* を使わない。
          #   未保護の requirements に任意パッケージ・URL・ローカルビルドを
          #   追加されると、署名検証より前に任意コードが走る。
          mkdir -p /tmp/pin
          git show "$G1_TOOLS_COMMIT:tools/requirements.lock" > /tmp/pin/requirements.lock
          python3 -m venv /tmp/pin/venv
          /tmp/pin/venv/bin/pip install --require-hashes -r /tmp/pin/requirements.lock

      - name: 署名鍵の許可リスト
        run: |
          set -euo pipefail
          printf '%s\n' "${{ vars.G1_ALLOWED_SIGNERS }}" > /tmp/allowed_signers
          test -s /tmp/allowed_signers || { echo "G1_ALLOWED_SIGNERS が空"; exit 2; }
          git config gpg.format ssh
          git config gpg.ssh.allowedSignersFile /tmp/allowed_signers

      - name: 承認検証（固定 SHA から runner を取り出して隔離実行）
        env:
          G1_TOOLS_COMMIT: ${{ vars.G1_TOOLS_COMMIT }}
        run: |
          set -euo pipefail
          # ★ tools/g1_ci_verify.sh は呼ばない。ラッパー自身も改変されうるため、
          #   同等の処理をこの workflow に展開することが trust anchor になる。
          rm -f build/spec-reconcile-report.json
          TMP=$(mktemp -d); mkdir -p "$TMP/tools"
          for f in tools/g1_trusted_verify.py tools/g1_validate.py tools/g1_extract.py; do
            git show "$G1_TOOLS_COMMIT:$f" > "$TMP/$f"
          done
          env -u PYTHONPATH -u G1_VALIDATOR_COMMIT -u G1_RUNNER_COMMIT \
              G1_REPO_ROOT="$PWD" \
              G1_RUNNER_COMMIT="$G1_TOOLS_COMMIT" \
              G1_VALIDATOR_COMMIT="$G1_TOOLS_COMMIT" \
              /tmp/pin/venv/bin/python -I "$TMP/tools/g1_trusted_verify.py"

      - name: g1.complete と provenance を確認
        env:
          G1_TOOLS_COMMIT: ${{ vars.G1_TOOLS_COMMIT }}
        run: |
          set -euo pipefail
          test -f build/spec-reconcile-report.json
          /tmp/pin/venv/bin/python - <<'PY'
          import json,os,sys
          r=json.load(open('build/spec-reconcile-report.json'))
          g1,pv=r['g1'],r['provenance']
          pin=os.environ['G1_TOOLS_COMMIT']
          ok = (g1['complete']
                and pv['validator_source_kind']=='external-pin'
                and pv['validator_source']==pin
                and pv['runner_source']==pin)
          print(json.dumps({'complete':g1['complete'],**pv},ensure_ascii=False,indent=1))
          sys.exit(0 if ok else 1)
          PY

      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        if: always()
        with: { name: g1b-approval-report, path: build/spec-reconcile-report.json }
