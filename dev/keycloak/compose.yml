services:
  samlscope:
    image: ${SAMLSCOPE_IMAGE:-samlscope:keycloak-smoke}
    build:
      context: ../..
    environment:
      SAMLSCOPE_MODE: selfhosted
      SAMLSCOPE_PUBLIC_BASE_URL: http://localhost:8080
      SAMLSCOPE_PEER_BASE_URL: http://localhost:8080
      SAMLSCOPE_DATA_DIR: /data
      SAMLSCOPE_IMAGE_DIGEST: ${SAMLSCOPE_IMAGE_DIGEST:?SAMLSCOPE_IMAGE_DIGEST must identify the image being run}
    ports:
      - "8080:8080"
    volumes:
      - samlscope-data:/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.2@sha256:9d1f1b2b7261ff53c66cb1092dfcdc34a5fb77e81f9e6a6e75b8b6a795de8067
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8180
    ports:
      - "8180:8080"
    volumes:
      - ./realm-samlscope.json:/opt/keycloak/data/import/realm-samlscope.json:ro

volumes:
  samlscope-data:
