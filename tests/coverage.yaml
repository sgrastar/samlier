      - key: IIP-SSO01.aw
        roles: [idp]
        level: MUST
        testability: CONFIG
        condition:
          predicate: supports_authnrequest_proxying
          predicate_kind: CAPABILITY_BASED
        configuration_failure_semantics: test_precondition
        summary_en: "When ProxyCount is zero and the identity provider cannot directly authenticate the presenter, it must return a Response whose top-level StatusCode is Responder"
        summary_ja: "ProxyCount=0 で主体を直接認証できない場合、最上位 StatusCode=Responder の Response を返す"
        references_spec: "SAML2Prof#4.1"
        reference_derivation: true
        reference_evidence:
          - spec: SAML2Errata
            locator: "E65: Second-level StatusCode||E66: "
            section_digest: "sha256:4ff4abbb230c96534615650e170d824ce9e0768b11a3d104971b1431ab59bce8"
            basis_ja: "SAML2Core 3.4.1.5.1 は <AuthnRequest> の処理規則の一部であり、SAML2Prof 4.1.3.3 の取り込み句を通じて Web Browser SSO Profile に入る。E65 が旧『MUST NOT proxy / 二次 ProxyCountExceeded MUST』を置換し、『Unless the identity provider can directly authenticate the presenter, it MUST return a <Response> message with a top-level <StatusCode> value of ...:Responder』とした"
        level_assignment: { idp: core }
        source_clauses:
          - { start: 0, end: 125, digest: "sha256:ff1057626aaa898cc4a76e1e0e4e9f6ad908c018ad60ce09d95e71634b08fac5", occurrences: 1 }
        required_variants:
          - id: v-99d255118e
            description_ja: "<Scoping ProxyCount=\"0\"> かつ対象が直接認証できない主体 → <Response> が返り、最上位 <StatusCode>/@Value が urn:oasis:names:tc:SAML:2.0:status:Responder"
          - id: v-e98274e3fa
            description_ja: "同じケースで対象が上流 IdP へ AuthnRequest を送らず、成功 assertion を返さない"
          - id: v-085dcda419
            description_ja: "対照: ProxyCount=0 でも対象が直接認証できる主体 → 成功応答でよい"
          - id: v-ef43ff5f02
            description_ja: "対照: ProxyCount=1 → プロキシしてよい"
        controls:
