            basis_ja: "SAML2Core 5 は assertion と protocol message に直接置かれる <ds:Signature> の profile であり、SAML2Prof 4.1.4.1『All processing rules are as defined in [SAMLCore]』を通じて入る。『SAML assertions and protocol messages MUST supply a value for the ID attribute on the root element of the assertion or protocol message being signed』"
