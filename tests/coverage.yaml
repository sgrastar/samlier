  - id: IIP-SP12
    section: 3.1
    section_name: "Service Provider / Web Browser SSO"
    anchor: "#IIP-SP12"
    source_section_digest: "sha256:5ce6664100b8106fe6d87dfc242059156cbbb1ff9215aaffc916b0c69b36103f"
    source_section_length: 484
    non_normative_spans:
      - { start: 221, end: 283 }
      - { start: 296, end: 484 }
    obligations:
      - key: IIP-SP12.a
        roles: [sp]
        level: MUST_NOT
        testability: CONFIG
        condition: null
        configuration_failure_semantics: test_precondition
        summary_en: "Must not require that a persistent name identifier carry semantics or structure beyond what SAML2Core 8.3.7 defines"
        summary_ja: "persistent NameID の構造・内容に、SAML2Core 8.3.7 を超える要求を課してはならない"
        references_spec: "SAML2Core#8.3.7"
        reference_derivation: true
        reference_evidence:
          - spec: SAML2Core
            locator: "8\\.3\\.7 Persistent Identifier||8\\.3\\.8 Transient Identifier"
            section_digest: "sha256:6add1e8cf39e4ece3e97563d6877daefe876ee1c20dd2c9fc253f8562a69de9e"
            basis_ja: "§8.3.7 が persistent 識別子に与える値空間（不透明・擬似乱数・256 コードポイント以下・NameQualifier / SPNameQualifier / SPProvidedID の意味）。ここを超える構造・内容を要求してはならない、というのが IIP-SP12"
        level_assignment: { sp: core }
        source_clauses:
          - { start: 0, end: 220, digest: "sha256:4487b42c20370f092f5033eb30b075ff01457fce9808d0e09cc845bbb6d298db", occurrences: 1 }
        required_variants:
          - id: v-a2762edca6
            description_ja: "【前提】未知の主体を自動的に受け入れる設定（自動プロビジョニング / JIT）にしたうえで実行する"
          - id: v-85eb163259
            description_ja: "新規主体 A に不透明な擬似乱数値（英数 32 文字）→ 受理される"
          - id: v-10a9719c14
            description_ja: "新規主体 B に長さ 1 コードポイントの値 → 受理される"
          - id: v-2a577559f7
            description_ja: "新規主体 C に長さ 256 コードポイントの値 → 受理される"
          - id: v-8e34c9b1f4
            description_ja: "新規主体 D に区切り記号（@ / = / :）を含む値 → 受理される"
          - id: v-0e73bc8b6f
            description_ja: "新規主体 E に区切り記号を一切含まない値 → 受理される"
          - id: v-c25b387f84
            description_ja: "新規主体 F に SPNameQualifier を省略した NameID → 受理される（§8.3.7 で省略が許されている）"
          - id: v-ca630ac6b1
            description_ja: "対照: §8.3.7 に適合しない値（257 コードポイント）→ 拒否してよい。これを FAIL にしない"
          - id: v-683419f892
            description_ja: "対照: 自動プロビジョニングを切った構成で新規主体 → 拒否される。これも FAIL にしない"
        controls:
          - "★ 訂正: 前版は『§8.3.7 に適合する任意の値を受理する』としていたが、原文は『NameID に §8.3.7 を超える意味・構造を要求してはならない』であって、未知の主体・未プロビジョニング・アカウント連携ポリシーなど**構造以外の正当な理由による拒否まで禁じてはいない**"
          - "★ したがって『自動プロビジョニングが有効で、任意の新規主体を受け入れられる』ことをテスト前提にする。前提を満たせない場合は not_verified(provisioning_precondition_unmet)。対象の不適合ではない"
          - "★ 訂正: 前版は『同一主体に別の不透明値を発行する』variant を置いていたが、これは persistent identifier の永続性そのものを壊す。値を変えるときは**別主体または別 IdP**を使う"
          - "★ 拒否理由が NameID の構造だと特定できなければ NOT_VERIFIED にする。属性は全 variant で固定し、変える値は NameID だけにする。エラー画面の文言・監査ログ・対象の申告のいずれかで理由を特定できたときだけ violated にできる"
          - "★ 『メールアドレス形式でないと動かない SP』はこの義務の典型的な違反であり、mutant SUT の候補にする"
        notes_ja: "訂正 1: 前版はこの義務を NOT_OBSERVABLE としていたが、§8.3.7 は persistent 識別子の値空間を規定しており、『構造を理由に範囲を狭めていないか』は観測できる。訂正 2: ただし観測できるのは『構造を理由とする拒否』だけで、『任意の値を必ず受理する』ことまでは原文が要求していない。テスト前提（プロビジョニング設定）が要るため testability は CONFIG とし、前提を満たせない場合は違反ではなく not_verified とする。設定・配備文書の上での要求は IIP-SP12.b（申告）で扱う。"
        authored_by: samlier-g1-builder
        review:
          # state は起票側の記録。承認の正本は tests/approvals/g1.yaml
          state: PENDING_REVIEW
          reviewer: null
          approved_at: null
          obligation_digest: "sha256:ba85ba24cee1ee2e47a6fc57a17317d9a2cb8f19720a8ee9075bfb5377983e4f"
          source_spec: kantara-fedinterop-impl
          spec_version: "1.1"
          source_selector: "#IIP-SP12"
          source_section_digest: "sha256:5ce6664100b8106fe6d87dfc242059156cbbb1ff9215aaffc916b0c69b36103f"
      - key: IIP-SP12.b
        roles: [sp]
        level: MUST_NOT
        testability: ATTESTED
        condition: null
        summary_en: "Must not require, through configuration or deployment documentation, that persistent identifiers carry structure or semantics beyond SAML2Core 8.3.7"
        summary_ja: "設定・配備文書の上でも、persistent NameID に §8.3.7 を超える構造・意味を要求しない"
        references_spec: "SAML2Core#8.3.7"
        reference_derivation: true
        reference_evidence:
          - spec: SAML2Core
            locator: "8\\.3\\.7 Persistent Identifier||8\\.3\\.8 Transient Identifier"
            section_digest: "sha256:6add1e8cf39e4ece3e97563d6877daefe876ee1c20dd2c9fc253f8562a69de9e"
            basis_ja: "同上。設定面・運用面での要求は SAML のプロトコル面に現れないため申告で確認する"
        level_assignment: { sp: core }
        source_clauses:
          - { start: 0, end: 220, digest: "sha256:4487b42c20370f092f5033eb30b075ff01457fce9808d0e09cc845bbb6d298db", occurrences: 1 }
        required_variants:
          - id: v-c4fc34691d
            description_ja: "persistent NameID の形式・接頭辞・正規表現を必須設定にしていないことを申告で確認する"
          - id: v-79788277d5
            description_ja: "NameID を主キーやメールアドレスとして扱う前提がないことを申告で確認する"
          - id: v-bda0025d23
            description_ja: "NameID の値から所属・権限などの意味を読み取る処理がないことを申告で確認する"
        controls:
          - "★ IIP-SP12.a で観測できるのは『Suite が送った値の集合』に対する挙動だけ。対象が特定の形式を必須設定として要求している場合、その設定を満たす値しか試していない可能性がある"
          - "★ 申告が IIP-SP12.a の観測と矛盾したら INCONSISTENT（申告では要求なし、実際は構造を理由に拒否）"
          - "★ 『NameID を主キーに使っている』こと自体は違反ではない。違反になるのは『NameID がある形式であることを要求する』場合に限る"
        notes_ja: "IIP-SP12.a（観測）と本義務（申告）は同じ原文句の別側面。証拠ラダー上、a の自動観測のほうが強い。"
        authored_by: samlier-g1-builder
        review:
          # state は起票側の記録。承認の正本は tests/approvals/g1.yaml
          state: PENDING_REVIEW
