            basis_ja: "SAML2Prof 4.1.3.3 の『The identity provider MUST process the <AuthnRequest> message as described in [SAMLCore]』および 4.1.4.1 の『All processing rules are as defined in [SAMLCore]』により取り込まれる。E45 反映後『If Comparison is set to \"better\", then the resulting authentication context MUST be stronger (as deemed by the responder) than one of the authentication contexts specified』"
