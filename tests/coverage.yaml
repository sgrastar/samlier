            description_ja: "SP（Samlier）が <samlp:ManageNameIDRequest>/<samlp:NewID> で代替識別子を設定 → 以降の Assertion の SPProvidedID がその値になる"
          - id: v-0c1b285f7c
            description_ja: "代替識別子を 2 回更新 → SPProvidedID が最新の値になる（1 回目の値が残っていない）"
          - id: v-c71d4ea87c
            description_ja: "secondary_peer（別 SP）が設定した代替識別子が、こちらの SP 向けの SPProvidedID に現れない（pair-wise の分離）"
        controls:
          - "★ 1 回設定して一致を見るだけでは『最も最近に設定された値』を検証していない。2 回更新し、古い値が残らないことを確認する"
          - "★ 対象が SAML2Core 3.6 の Name Identifier Management に対応しない場合、代替識別子は成立しえないので NOT_APPLICABLE。省略側（IIP-SSO05.a3）だけが適用される"
