          - spec: SAML2Core
            locator: "3\\.3\\.4\\s+Processing Rules||3\\.4\\s+Authentication Request Protocol"
            section_digest: "sha256:696700cde99f02c95741d21aa83210bacffe526ae770b593bd1b8865aa81e6ff"
            basis_ja: "strongly match の定義（identifier の復号後同一性・内容と属性の一致・SubjectConfirmation の確認可能性）"
          - spec: SAML2Core
            locator: "3\\.4\\.1\\.2\\s+Element <Scoping>||3\\.4\\.1\\.3\\s+"
            section_digest: "sha256:18cd102dedd09630b445fe6db425222aa67e58b0f515429557527a7443d9bc48"
            basis_ja: "<Scoping> / <IDPList> が二択（MAY examine ... and return an error）であること"
        level_assignment: { idp: core, sp: core }
        source_clauses:
