      - key: IIP-SSO01.fj
        roles: [sp]
        level: SHOULD
        testability: BROWSER
        condition: null
        summary_en: "An AuthnRequest should be signed or otherwise authenticated and integrity protected by its delivery binding"
        summary_ja: "AuthnRequest は署名するか、配送 binding で送信者認証と完全性保護を行うことが望ましい"
        references_spec: "SAML2Prof#4.1"
