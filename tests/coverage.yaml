        required_variants:
          - id: v-4013eedd13
            description_ja: "verdict 対象: <saml:Subject> 付き AuthnRequest。SAML2Core 3.4.1.4 が一意の結果を規定する（返る Assertion の Subject が要求と strongly match する、または要求された主体を認識できなければ error <Status> を返す）"
          - id: v-77b59b3e0d
            description_ja: "strong match — identifier: 要求 Subject の BaseID / NameID / EncryptedID と、応答 Subject の復号後 identifier の内容・全属性が一致する（NameIDPolicy が別 Format を指定した場合だけ、物理値は異なっても同一主体ならよい）"
          - id: v-e45043ebaf
            description_ja: "strong match — encryption: 要求側と応答側のどちらか一方だけが EncryptedID でも、復号後の identifier が同一なら一致として扱う"
          - id: v-487d2712a0
            description_ja: "strong match — confirmation: 要求 Subject に SubjectConfirmation が 1 件以上あれば、応答 Subject はその少なくとも 1 件の方式で確認可能な SubjectConfirmation を含む"
          - id: v-0b60ff9606
            description_ja: "negative control: identifier の内容または属性が異なる／要求した確認方式を 1 件も満たさない Assertion を成功応答として返す → violated"
          - id: v-b7935a4c4d
            description_ja: "情報記録のみ: <saml:Conditions>（SAML2Core 3.4.1: 'The responder MAY modify or supplement this set as it deems necessary'）"
          - id: v-c019bae96f
            description_ja: "対象外（取り込まれた SAML2Core の規則が扱う）: <Scoping>/@ProxyCount と <IDPList> — E65 反映後の ProxyCount=0 エラー処理と proxying 規則を IIP-SSO01.aw〜.bd で判定する。ただしそれらは『プロキシする場合』が条件で、プロキシしない IdP が Scoping を無視することは適合"
          - id: v-64c97f0648
            description_ja: "情報記録のみ: <RequesterID>（SAML2Core 3.4.1.2 に処理規則の記述がなく、3.4.1.2 の <IDPList> 検査は 'the intermediary MAY examine the list and return ...' の二択）"
          - id: v-912088ec9a
            description_ja: "情報記録のみ: 無効な AssertionConsumerServiceIndex（SAML2Core 3.4.1: 'MAY return an error <Response> or it MAY use the default location' — 二択が明示）"
          - id: v-67f70ac118
            description_ja: "情報記録のみ: ProviderName / Consent — SAML2Core に処理規則の記述がない"
          - id: v-6f10b7d2ad
            description_ja: "対象外（他義務が具体的処理規則を扱う）: <NameIDPolicy>→IIP-IDP10・IIP-SSO01.fl〜.fp / <RequestedAuthnContext> exact→IIP-IDP08、minimum/better/maximum→IIP-SSO01.ga〜.gc、候補順→.gj / ForceAuthn→IIP-IDP06 / IsPassive→IIP-IDP07 / AssertionConsumerServiceURL・ProtocolBinding・AssertionConsumerServiceIndex→IIP-IDP12 / AttributeConsumingServiceIndex→IIP-IDP04.b / <Extensions>・<Advice>→IIP-EXT01"
        controls:
          - "判定規則: SAML2Core が一意の結果（エラー XOR 無視）を規定する要素のみ verdict 対象にする。二択が許される要素は verdict を付けず情報記録のみとする"
          - "★ 訂正: 前版は <Scoping> / ProxyCount / <IDPList> をまとめて『二択なので情報記録のみ』としていたが、SAML2Core 3.4.1.5.1 には ProxyCount と IDPList について明確な MUST NOT / MUST がある。取り込み句（SAML2Prof 4.1.3.3）経由で IIP-SSO01.aw〜.bd に分解した"
          - "★ 横断調査の結論: AuthnRequest の任意コンテンツのうち、IIP の他要件も取り込み句由来の義務も call out していないものは <saml:Conditions> / <RequesterID> / ProviderName / Consent であり、いずれも一意の処理規則を持たない。一意の処理規則を持つ <saml:Subject> だけが本義務の verdict 対象になる"
          - "原文冒頭の 'Unless specifically called out by subsequent requirements in this profile' により、他の IIP 要件が扱う要素はこの義務の対象から外れる"
        notes_ja: "SAML2Core 3.4.1 / 3.4.1.4（saml-core-2.0-os, sha256:dc0890f8…）を直接読んで判定規則と verdict 対象を確定した。原文の非規範の例（Subject は required semantics、Conditions は optional semantics）とも一致する。"
        authored_by: samlier-g1-builder
