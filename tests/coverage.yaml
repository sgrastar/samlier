            basis_ja: "SAML2Core 5 は assertion と protocol message に直接置かれる <ds:Signature> の profile であり、SAML2Prof 4.1.4.1『All processing rules are as defined in [SAMLCore]』を通じて入る。『Unless a profile specifies an alternative signature mechanism, any XML Digital Signatures MUST be enveloped』"
