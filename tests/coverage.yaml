          - "★ 訂正: 前版は『IdP-initiated（unsolicited）正常系』を必須 variant にしていたが、§4.1.5 の開始は MAY である（IIP-SSO01.z）。必須にすると unsolicited を発行しない適合 IdP を FAIL にする。unsolicited 固有の義務は IIP-SSO01.y / .y1 に条件付きで置いた"
        notes_ja: "【CP1 照合記録】2026-08-27 に §4.1（Errata 反映）・取り込み句 A・取り込み句 B を、欠落検査（原文→義務）と過剰検査（義務→実効原文）の双方向で再照合した。Errata の置換優先順位を確認し、E43/E93 で消えた旧 §6.2、E79 の旧 SessionNotOnOrAfter MUST、E81 の旧 RSA-SHA1 SHOULD は生成対象から除外した。以下を対応表の正本とする。  【§4.1 の RFC2119 句 → 義務の対応表】4.1.1: bearer confirmation method を使用する。E47 が bearer method に追加した intended attesting entity の識別 SHOULD → .fr、複数 attesting entity の複数 SubjectConfirmation SHOULD → .gd。4.1.2: Redirect を応答に使わない → .x ／ SP が Discovery を使ってよい（MAY）→ IIP-SP04。4.1.3.1: RelayState を使ってよい（MAY）→ .ab の注記 ／ 元要求をできるだけ露出しない（SHOULD）→ .ac。4.1.3.2: Discovery / 別サービスへの誘導 / メタデータの利用（すべて MAY）→ 権限であり義務を起こさない。4.1.3.3: TLS 上で行うことが RECOMMENDED → .ad ／ AuthnRequest の署名は MAY → 権限 ／ 『IdP MUST process the <AuthnRequest> as described in [SAMLCore]』は**取り込み句**であり、取り込まれる SAML2Core の規範句を下記【取り込み句 A】に展開した。4.1.3.4: principal の identity を確立する（MUST）→ .ae。4.1.3.5: 成功・失敗にかかわらず Response / artifact を含む HTTP 応答を生成する（SHOULD、E85 でエラー応答を強化）→ 成功側は .a・.g、エラー側は IIP-IDP05.a（IIP が MUST に強化） ／ ACS 位置が SP の管理下だと確かめる（MUST）→ IIP-IDP12.b ／ 指定された binding と ACS を可能なら honor する（MUST）→ IIP-IDP12.a・.e・.f ／ TLS が RECOMMENDED → .ad ／ POST 時の Assertion / Response 署名（MUST、E26・E93 反映）→ .v ／ CBC-mode EncryptedAssertion の Response 署名（SHOULD, E93）→ .fv ／ 『SP MUST process the <Response> as described in [SAMLCore]』は**取り込み句**で、profile 固有の処理規則は .n〜.r1、取り込まれる SAML2Core の一般規則は下記【取り込み句 B】。4.1.3.6: セキュリティコンテキストの確立は MAY → 権限。4.1.4.1: Issuer（MUST）→ .b ／ 要求を満たせないときのエラー応答（MUST）→ IIP-IDP05.a ／ Subject に SubjectConfirmation を入れない（MUST NOT）→ .c ／ 主体を認識できないときのエラー（MUST）→ .d ／ 未認証要求の情報を信頼しない（MUST NOT）→ .e ／ ACS の検証（MUST）→ IIP-IDP12.b ／ ★『SP が新規識別子の作成を望むなら AllowCreate=true を含めなければならない』という旧 Profile MUST は SAML2Errata E14 が §4.1.4.1 から削除した。一方、E14 が Core 3.4.1.1 に追加した新規則は取り込み句 A で .fl〜.fp に分解する。4.1.4.2（E17・E26・E52 反映）: .f〜.m ／ Address 属性・追加の statement・AttributeConsumingServiceIndex の無視は MAY → 権限 ／ 『条件は SP に理解・受理されなければ assertion は妥当でない』は SP 側の処理であり .r に含む。4.1.4.3（E26・E93 反映）: .n〜.t ／ CBC-mode EncryptedAssertion の Response 署名（SHOULD）→ .fv ／ Address の照合は MAY → 権限。4.1.4.4: .u・.u1。『using the Artifact Resolution profile』は artifact の参照解決機構を特定するが、この節が追加で明示する規範内容は相互認証・完全性・機密性と intended SP への限定であり、この 2 義務に分解する。Artifact Resolution Profile §5 全体を SSO01 に再帰的に二重計上しない ／ 4.1.4.5（E26 反映）: .v・.w。4.1.5（E90 追記を含む）: 開始は MAY → .z ／ InResponseTo を含めない（MUST NOT）→ .y ／ 既定 ACS への配送（SHOULD）→ .y1 ／ SP は unsolicited を扱えるようにしておく（SHOULD）→ .y2 ／ SP は unsolicited の受理を無効化できるべき（SHOULD, E90）→ .aa ／ RelayState の受け渡しは MAY → 権限。E90 が追加する新 §4.1.6『Use of Relay State』: URL scheme を https / http に限る（SHOULD）→ .ab。OS 版 §4.1.6『Use of Metadata』: IIP-SSO06 が同じ節を直接扱うのでここでは重複させない。★ E90 は errata 反映版に新 §4.1.6 を挿入するため、節番号 4.1.6 が OS 版（Use of Metadata）とerrata 反映版（Use of Relay State）で指す先が違う。IIP-SSO06 は節名も併記して OS 版を指しているので曖昧さはない。  【取り込み句 A: IdP MUST process the <AuthnRequest> as described in [SAMLCore]】取り込み範囲は、<AuthnRequest> の構文・検証・処理と、その処理が直接参照する共通規則の依存閉包である。節番号の短い列挙を正本とせず、以下の節ごとの対応表（§1.1・§1.3・§3.2.1・§3.3.2.2.1・§3.4.1〜§3.4.1.5.1・§4・§5・§6）を正本とする。独立した別 protocol である §3.5 Artifact Resolution・§3.6 Name Identifier Management 等は、Profile §4.1 または対応表が個別に取り込む規範句を除き対象外とする。§1.1 Notation（スキーマ文書が構文の正本）+ protocol / assertion schema: SP の AuthnRequest → .cg ／ IdP の Response → .dv ／ IdP の Assertion・AuthnStatement → .dw ／ プロキシ IdP の AuthnRequest（条件付き）→ .dx。★ role ごとに義務を分けている（variant に role フィールドがないため、1 義務に idp/sp を持たせると G2 で片方の role が他方の variant まで覆う必要があるように見える）。§1.3.1 文字列: 空白以外を 1 文字以上 → .dz ／ 完全バイナリ比較 → .ea ／ 大文字小文字無視・空白正規化・ロケール変換に依拠しない → .eb ／ 異なる符号化の比較は NFC → .ec ／ 外部データとの比較で XML 正規化を考慮 → .ed ／ ソート順に依拠しない → .ee。§1.3.2 URI: 空白以外を 1 文字以上かつ絶対 URI → .ef。§1.3.3 時刻: タイムゾーンなし UTC → .eg ／ ミリ秒より細かい分解能に依拠しない（SHOULD NOT）→ .eh ／ うるう秒を生成しない → .ei ／ E92 の合理的な clock skew（SHOULD）は IIP-G01 が MUST に強化して直接扱う。§1.3.4: 別オブジェクトへの重複割当をしない → .af（SP）/ .ao（IdP。<Response>/@ID と <Assertion>/@ID の両方）／ 宣言はちょうど 1 つ → .cc ／ 乱数使用時の衝突確率 ≤2^-128 → .cd ／ 同 ≤2^-160（SHOULD）→ .ce ／ PRNG の seed → .cf。§3.2.1: 要求 @ID と応答 @InResponseTo の一致 → .ap ／ @Destination の照合と破棄 → .ag ／ 拡張要素の名前空間修飾 → .ah ／ 署名の検証 → .ai ／ 署名不正時に内容へ依拠しない → .aj ／ 署名不正時のエラー応答（SHOULD）→ .ak ／ 署名者の同一性・妥当性の評価（SHOULD）→ .al ／ Consent 付き要求の署名（SHOULD）→ .am（SP）/ .gh（proxy IdP） ／ 不正な要求へ応答する場合の <StatusCode>（MUST）→ .an。§3.4.1 本体と §3.4.1.1 NameIDPolicy: ForceAuthn → IIP-IDP06 ／ IsPassive → IIP-IDP07 ／ AuthnRequest の署名または binding による認証・完全性保護（SHOULD）→ .fj（SP）/ .fx（proxy IdP） ／ NameIDPolicy の基本処理 → IIP-IDP10 ／ E14 の AllowCreate 新規則 → .fl〜.fp （.fl / .fm は『特定用途に使わない』条件を述語で明示）／ ACS 3 属性 → IIP-IDP12 ／ RequestedAuthnContext exact → IIP-IDP08、minimum / better / maximum → .ga / .gb / .gc、候補の優先順評価 → .gj ／ AttributeConsumingServiceIndex → IIP-IDP04.b ／ Subject → IIP-SSO01.c・.d と IIP-SSO07.b ／ ProviderName・Consent は処理規則の記述がなく IIP-SSO07.b の情報記録。§3.4.1.2 <Scoping>: RFC2119 の義務は『profiles specifying an active intermediary』の MAY のみ → 権限。§3.4.1.3 <IDPList>: <GetComplete> の解決結果に対する MUST → .av。§3.4.1.4 処理規則: 要求の仕様を満たす assertion か誤り応答か → IIP-IDP10.d ／ 認証できない・主体不明・ポリシーで拒否する場合の誤り応答 → IIP-IDP05.a と .d ／ <Subject> の strongly match → IIP-SSO07.b ／ 内容が空の場合の含意（AuthnStatement・AudienceRestriction）→ .l・.m。§3.4.1.5・§3.4.1.5.1 プロキシ: .aw〜.bj（すべて supports_authnrequest_proxying が条件）。★ E65 は ProxyCount=0 の旧『MUST NOT proxy / 二次 ProxyCountExceeded MUST』を置換したため、.aw は最上位 Responder の MUST、.ax は二次 ProxyCountExceeded の MAY として反映する。§4 バージョン処理: 双方が対応する最高版で要求を出す（SHOULD）→ .fg（SP）/ .ge（proxy IdP） ／ 応答元の能力が不明なら自身の最高版を仮定（SHOULD）→ .fh（SP）/ .gf（proxy IdP） ／ 未対応バージョンの assertion を発行しない → .ej ／ 未対応 major の assertion を処理しない → .ek ／ 自分が扱えない応答版に対応する要求を出さない → .el（SP）/ .gg（proxy IdP） ／ 未対応 major の要求を拒否 → .em ／ 要求より高い応答版を出さない → .en ／ 要求より低い major を出さない（VersionMismatch 報告を除く）→ .eo ／ 非互換時の最上位 VersionMismatch → .ep ／ V1 assertion を V2 応答に含めない → .eq。★ .eo の例外は二次コード RequestVersionTooHigh に限られる（VersionMismatch 一般ではない）。『minor が高い要求は処理しても拒否してもよい』（MAY）と『同じ major を共有する要求は同じ処理規則を持つ』（MUST。実装への義務ではなく仕様の性質の宣言）は義務を起こさない。§4.2 の namespace version 対応は仕様の書き手への規範なので義務を起こさない。§4.2.1 の将来拡張に備える SHOULD / mandatory semantics の未知拡張を拒否する SHOULD は、IIP-SSO07.b と IIP-EXT01 が内容種別ごとの処理結果を直接規定するため、そちらで判定し二重計上しない。§5 XML Signature profile: enveloped 署名 → .er ／ ★ RSA-SHA1 対応の旧 SHOULD は E81 が『任意の XML Signature アルゴリズムを MAY で使用できる』に置換したため義務を起こさない ／ 発行元以外から得る assertion の署名（SHOULD）→ .es ／ 発信者以外から届くメッセージの署名（SHOULD）→ .et（IdP の Response）/ .fj（SP の AuthnRequest）／ 署名対象ルートの ID → .eu ／ **単一 <ds:Reference> と same-document reference → .ev** ／ Exclusive C14N（SHOULD）→ .ew ／ 許可外 transform を含めない（SHOULD NOT）→ .ex ／ **許可外 transform を受理するなら内容が署名対象から除外されないことを保証 → .ey（SP）/ .fk（IdP）** ／ <ds:KeyInfo> は省略可（MAY）→ 権限 ／ E91 の <ds:Object> 送出 SHOULD NOT → .fs、verifier の拒否 SHOULD → .ft（SP）/ .fu（IdP） ／ §5.3 署名継承は小文字 should の記述なので advisory。§6 暗号化: E30 反映後も残る同じ位置での置換 → .ez（assertion）/ .fd（識別子）/ .fe（属性）／ §6.1 の @Type は .dm / .dn（§2.2.4 と同じ規則）。★ OS 版 §6.2 の『逆順で検証・復号 / assertion は署名後に暗号化 / 識別子・属性は暗号化後に外側署名』は、E43 が節全体を Key and Data Referencing Guidelines に置換し、さらに E93 が Encryption and Integrity Protection に置換した。したがって旧 §6.2 由来の .fa / .fb / .fc / .ff は Errata 反映後には存在せず削除する。E93 の現行 §6.2 にある CBC 暗号データの処理前完全性保護（SHOULD）→ .fw、Profile 4.1 への Response 署名追記（SHOULD）→ .fv。★ .ez / .fd / .fe は実際に送出された暗号化要素ごとの受動規則とし、観測がなければ satisfied_with_note。★ .er / .eu / .ev / .ew / .ex は**条件を持たない**。§5.4 の制約は『署名能力がある製品』ではなく実際に生成された各 XML 署名に適用される実行時条件なので、対象が送出した各署名を受動的に検査し、署名が 1 つも観測されなければ satisfied_with_note とする。★ .ey も**条件を持たない**。適用性はケース実行より先に評価されるため、『受理したかどうか』を条件にすると観測するためのケースが観測前にスキップされる循環になる。評価は transform ごとに『拒否した → satisfied ／ 受理したが内容を何も除外していない → satisfied ／ 内容を除外した署名を受理した → violated ／ 除外の有無を確認できない → not_verified』。原文が求めるのは『no content of the SAML message is excluded from the signature』であって、除外された内容を使わないことではない。受信するメッセージが role で違う（SP は <Response> / <Assertion>、IdP は <AuthnRequest>）ため role 別に義務を分けた。恒等な transform は受理・拒否の**二択**なので required variant にはせず、Suite 側 fixture の自己検証に置いて対象の verdict には影響させない（自己検証で見るのは fixture の署名が暗号学的に正しいことと恒等 transform が内容を除外しないことだけ。対象は許可外 transform の存在だけを理由に拒否しても適合なので、拒否理由は区別しない）。★ .fk は**常に署名済み AuthnRequest を送る**。対象が署名を必須にしているかどうかと、受信した署名を正しく検証する義務は別である。Suite SP の鍵を信頼させられない場合に限り not_verified とする。★ .ev / .ey は XML Signature Wrapping への直接の検出にあたる。  【取り込み句 B: SP MUST process the <Response> and enclosed <Assertion> as described in [SAMLCore]】取り込み範囲は、<Response> と内包 <Assertion> の構文・検証・処理、およびそれらが直接参照する共通規則の依存閉包である。以下の対応表（§2 全体・§3.2.2・§3.2.2.2、および共通規則として対応表に明記した §1・§4・§5・§6）を正本とする。§3.5 Artifact Resolution は別 protocol であり、Profile §4.1.4.4 が明示する 2 規範句（IIP-SSO01.u / .u1）を除いて、本取り込み句から再帰的に取り込まない。§3.2.2: @ID の一意性 → .ao ／ 要求への応答での @InResponseTo 必須・一致 → .ap ／ unsolicited の @InResponseTo 禁止 → .y、要求 ID を特定できない error path の禁止 → .gi ／ @Destination の照合と破棄 → .aq ／ 拡張要素の名前空間修飾 → .ah ／ 署名の検証 → .n ／ 署名不正時に内容へ依拠しない → .ar ／ 署名不正をエラーとして扱う（SHOULD）→ .as ／ 署名者の同一性・妥当性の評価（SHOULD）→ .at ／ Consent 付き応答の署名（SHOULD）→ .au。§3.2.2.2: 最上位 <StatusCode>/@Value が top-level リストの値 → .ch。★ 取り込み句 B の対象は §2 SAML Assertions 全体である（前版は §2.5 Conditions 中心に限定していた）。節ごとの対応は次のとおりで、義務を起こさない節にはその理由を書く。§2.1 スキーマ宣言: 規範句なし。§2.2.1 <BaseID> / §2.2.2 NameIDType: NameQualifier / SPNameQualifier の省略（SHOULD）→ .cy。§2.2.3 <NameID>: 規範句なし（Format ごとの規則は §8.3 で、IIP-SSO05 が扱う）。§2.2.4 <EncryptedID>: @Type の存在（SHOULD）→ .dm ／ @Type の値 → .dn ／ 暗号化内容の型（NameIDType **または AssertionType**、およびそれらの派生型）→ .do ／ **ciphertext の一意性 → .dp（この MUST は §2.2.4 にのみ置かれているので <EncryptedID> に限定）** ／ wrapped key の Recipient（SHOULD）→ .dq。§2.2.5 <Issuer>: RFC2119 句なし。Format 既定値 entity の帰結は .h / .i、修飾属性の省略は .cy。§2.3.1 <AssertionIDRef> / §2.3.2 <AssertionURIRef>: 規範句なし。Web Browser SSO は assertion を値で運ぶので参照形式は使わない。§2.3.3 <Assertion>: @ID の一意性 → .ao ／ 必須の @Version / @IssueInstant / <Issuer> → .dw（生成）・.cx（受信拒否）／ <Statement> の xsi:type → .ci ／ statement のない assertion は <Subject> を含む → .cj ／ 署名の検証 → .n ／ Assertion 署名不正時に依拠しない → .fy ／ Assertion issuer の評価（SHOULD）→ .fz ／ 『issuer は relying party にとって一義的であるべき』（SHOULD）は .i（MUST）に包含される。§2.3.4 <EncryptedAssertion>: .dm / .dn / .do / .dq。§2.4.1 <Subject>: 2 人以上の主体を識別しない（SHOULD NOT）→ .cz（スキーマの choice 制約だけでなく、<SubjectConfirmation> 内の識別子など意味上の複数主体を見る）。§2.4.1.1 <SubjectConfirmation>: E47 が追加した『Subject と異なる entity に使用させる場合はその entity を識別する（SHOULD）』→ .fr ／ bearer の要求は .j / .k（SAML2Prof 由来）。§2.4.1.2 <SubjectConfirmationData>: 拡張属性の名前空間 → .da ／ 妥当期間が assertion の内側（SHOULD。**上限・下限の両端**）→ .db ／ NotBefore < NotOnOrAfter → .dc ／ @Address の表記（SHOULD）→ .ds ／ bearer での Recipient / NotOnOrAfter / NotBefore 禁止 / InResponseTo → .k / .k1 / .k2。§2.4.1.3 KeyInfoConfirmationDataType: **義務を起こさない**。『確認方式が機構を定義する』は仕様の書き手への規範であって実装への義務ではなく、残りは holder-of-key 確認方式に固有で、Web Browser SSO は bearer を使う（.j）。ECP の holder-of-key は IIP-IDP13 が別に扱う。§2.5 Conditions: 下記のとおり。§2.6 <Advice>: 無視してよい任意コンテンツで、IIP-EXT01 が扱う。§2.7.1 <Statement>: xsi:type → .ci。§2.7.2 <AuthnStatement>: <Subject> の必須 → .dd ／ 必須の @AuthnInstant / <AuthnContext> → .dw・.cx ／ ★ SessionNotOnOrAfter の旧『セッションを終了扱いにする MUST』は E79 が上限の説明へ置換したため義務を起こさない。Web Browser SSO における具体的な処理は Profile 4.1.4.3 の .t（SHOULD）だけを適用する ／ SessionIndex の相関防止（SHOULD NOT）→ .de ／ 推奨される 2 方式（RECOMMENDED）→ .dy ／ 方式 (a) の値域の濃度（SHOULD）→ .df ／ 方式 (a) のランダム選択（SHOULD）→ .dg ／ SLO 対応時の SessionIndex 必須 → .l1。★ .df / .dg は原文の**方式 (a) の内部規則**なので述語 uses_small_integer_sessionindex を条件にしている。方式 (b)（assertion の @ID を使う）を採る実装には適用されない。§2.7.2.1 <SubjectLocality>: @Address の表記（SHOULD）→ .ds。§2.7.2.2 <AuthnContext>: 固有の RFC2119 句なし。要求側の扱いは IIP-IDP08 / IIP-SP06 / IIP-SP07。§2.7.3 <AttributeStatement>: <Subject> の必須 → .dh。§2.7.3.1 <Attribute>: @FriendlyName を同定の根拠にしない → IIP-SP11.a ／ 拡張属性の名前空間 → .di ／ 値のない属性は <AttributeValue> を省略 → .dj ／ **複数の離散値は個別の <AttributeValue> に（RECOMMENDED）→ .du** ／ 『複数 <AttributeValue> に xsi:type があるなら全て同一型』は小文字 must なので advisory ／ 『他の用途は semantics を定義しなければならない』は**仕様の書き手への規範**なので義務を起こさない。§2.7.3.1.1 <AttributeValue>: 空値 → .dk ／ null 値 → .dl。§2.7.3.2 <EncryptedAttribute>: .dm / .dn / .do / .dq。§2.7.4 <AuthzDecisionStatement> 以下: **義務を起こさない**。Web Browser SSO Profile は認可決定 statement を使わず、IdP が同梱した場合の扱いは IIP-SSO07.b（未対応の任意コンテンツ）が扱う。URI 正規化の SHOULD 群も認可決定の資源 URI に固有で、本 profile の対象外。§2.5.1 <Conditions>: <Condition> の xsi:type → .ck ／ <OneTimeUse> は 1 つまで → .cl ／ <ProxyRestriction> は 1 つまで → .cm。§2.5.1.1: Invalid / Indeterminate な assertion の拒否 → .co。§2.5.1.2: NotBefore < NotOnOrAfter → .cn ／ 期間の検証 → .p・.r。§2.5.1.4: 複数 <AudienceRestriction> の独立評価 → .cp ／ <Audience> に SP の entityID → .m。§2.5.1.5 <OneTimeUse>: 直ちに使う（SHOULD）→ .cq ／ 将来利用のため保持しない → .cr ／ 保持する実装は遵守する → .cs ／ 1 つまで → .cl。§2.5.1.6 <ProxyRestriction>: 制限に違反する assertion を発行しない → .ct ／ Count=0 → .cu ／ Count 減算 → .cv ／ <Audience> の範囲 → .cw ／ 1 つまで → .cm。§2.5 Conditions の期間・Audience の検証そのものは .r。§1.3.4 の細目のうち、プロキシ IdP が上流へ生成する AuthnRequest の @ID は .dr（条件付き）。"
