    non_normative_spans: []
    obligations:
      - key: IIP-IDP07.a
        roles: [idp]
        level: MUST_NOT
        testability: BROWSER
        condition: null
        summary_en: "If IsPassive is true, the identity provider and the user agent must not visibly take control of the user interface and interact with the presenter in a noticeable fashion"
        summary_ja: "IsPassive=true のとき、UI を可視的に奪って利用者と目立つやり取りをしてはならない"
        references_spec: "SAML2Core#3.4.1"
        reference_derivation: true
        reference_evidence:
          - spec: SAML2Core
            locator: "3\\.4\\.1 Element <AuthnRequest>||3\\.4\\.1\\.1 Element <NameIDPolicy>"
            section_digest: "sha256:afa441f55c94a0bbcee454e322f7fe6bfcc28401aa67f9a6b0eca291fdc0b21c"
            basis_ja: "SAML2Core 3.4.1 の IsPassive 属性『If \"true\", the identity provider and the user agent itself MUST NOT visibly take control of the user interface from the requester and interact with the presenter in a noticeable fashion』"
        level_assignment: { idp: core }
        source_clauses:
          - { start: 0, end: 115, digest: "sha256:50adf1500e90078d332a3aa499622764cff2bfe7f62689e9699d3d6541ea16fe", occurrences: 1 }
        required_variants:
          - id: v-f3d6d26138
            description_ja: "既存セッションあり + IsPassive=true → 利用者操作なしで Assertion が返る（可視の画面遷移が発生しない）"
          - id: v-ff14535163
            description_ja: "既存セッションなし + IsPassive=true → 認証画面・同意画面が一切出ない（判定対象はここ）"
          - id: v-e4bf92c122
            description_ja: "同上のとき返る応答が、エラー <Status> を持つ <Response> であること（判定は IIP-IDP05.a。ここでは観測のみ記録する）"
          - id: v-bc823d23ce
            description_ja: "対照: 既存セッションなし + IsPassive 省略（既定 false）→ 認証画面が出てよい。これを FAIL にしない"
          - id: v-0aa2854948
            description_ja: "同意画面・属性リリース画面も『目立つやり取り』に含まれる（IsPassive=true では出さない）"
        controls:
          - "★ 2 状態（セッションあり／なし）の対照が必須。片方だけでは対応を証明できない"
          - "★ 訂正: 前版は『セッションなし + IsPassive=true → NoPassive エラー』を必須 variant にしていたが、二次 status code は SAML2Core 3.4.1.4 で MAY。NoPassive が返らないことを FAIL にしてはならない。判定は『エラー <Status> を持つ <Response> が返る』かつ『可視の画面が出ない』まで"
          - "★ 『可視の UI 奪取』は Suite が直接観測する必要がある。ブラウザ自動化で中間ページ・フォーム表示の有無を記録する。リダイレクトが挟まっても、利用者の操作を要求しなければ違反ではない"
          - "★ 原文の名宛人は identity provider と user agent の両方だが、適合試験の対象は IdP 側だけである"
          - "★ 『エラー <Response> を返すこと』は SAML2Core 3.4.1.4 の一般規則であり、IIP では IIP-IDP05.a が持つ。ここで二重に判定しない"
        notes_ja: "『If a value is not provided, the default is \"false\"』は既定値の定義であって義務ではない。ForceAuthn と併用したときの禁止は IIP-IDP06.c で扱う。"
