  - id: IIP-SSO06
    section: 2.3
    section_name: "Common / Web Browser SSO"
    anchor: "#IIP-SSO06"
    source_section_digest: "sha256:5f89f43ec523b20c1b438877bc273876f388ba0e70ff85ab243322e441824fd3"
    source_section_length: 1318
    non_normative_spans:
      - { start: 377, end: 778 }
      - { start: 801, end: 884 }
      - { start: 885, end: 1318 }
    obligations:
      - key: IIP-SSO06.a
        roles: [idp, sp]
        level: MUST
        testability: CONFIG
        condition:
          predicate: setting_supported_by_implementation
          predicate_kind: CAPABILITY_BASED
        configuration_failure_semantics: normative_capability
        summary_en: "Consume peer configuration values from metadata, without additional inputs, for every element identified as MUST or MAY in SAML2Prof 4.1.6 that corresponds to a supported setting"
        summary_ja: "SAML2Prof 4.1.6 で MUST/MAY とされた各メタデータ要素のうち、対象が対応する設定について、追加入力なしでメタデータから取り込む"
        references_spec: "SAML2Prof#4.1.6"
        reference_derivation: true
        reference_evidence:
          - spec: SAML2Prof
            locator: "4\\.1\\.6\\s+Use of Metadata||4\\.2\\s+Enhanced Client or Proxy"
            section_digest: "sha256:f52cb0fa5c1b269dc444637eee266c503ead00ad24b477e51b2a18281b6e9f29"
            basis_ja: "§4.1.6 の全文を読み、RFC2119 の MUST / MAY を伴う要素のみを列挙した"
        level_assignment: { idp: core, sp: core }
        source_clauses:
          - { start: 0, end: 376, digest: "sha256:7bf32b4a620f48a0a471abd2fe2b41640c95265faa6f315d2f92295ed3411cda", occurrences: 1 }
        required_variants:
          - "md:IDPSSODescriptor/@WantAuthnRequestsSigned — MAY be used by an identity provider to document a requirement that requests be signed"
          - "md:SPSSODescriptor/@AuthnRequestsSigned — MAY be used by a service provider to document the intention to sign all of its requests"
          - "md:KeyDescriptor use=signing — providers MAY document the key(s) used to sign requests, responses, and assertions（Errata 05 E58 により sign→signing）"
          - "md:KeyDescriptor use=encryption — MAY be used to document supported encryption algorithms and settings, and public keys（Errata 05 E58 により encrypt→encryption）"
          - "md:SPSSODescriptor/@WantAssertionsSigned — MAY be used by a service provider to document a requirement that assertions be signed"
          - "md:ArtifactResolutionService — 条件付き MUST: HTTP Artifact バインディングで配送する場合、artifact issuer は少なくとも 1 つ提供しなければならない"
          - "md:IDPSSODescriptor が含みうる md:NameIDFormat / md:AttributeProfile / saml:Attribute — MAY"
          - "md:AttributeConsumingService — One or more ... MAY be included in its metadata（@index / @isDefault はこの要素の一部であり、個別に MAY とはされていない）"
        controls:
          - "各要素について Suite メタデータの値を変更し、対象の挙動が追従するかを見る"
          - "追従しない要素があれば、その要素に対応する設定を対象が備えているか（IIP-SSO06 の条件 (b)）を確認してから判定する"
          - "★ md:SingleSignOnService と md:AssertionConsumerService は §4.1.6 で RFC2119 キーワードを伴わずに記述されているため、IIP-SSO06 の条件 (a)（\"MUST\" or \"MAY\" と示された要素）に該当せず、この義務の対象外とする"
        notes_ja: "Errata 05 E58 により KeyDescriptor の use 値は signing / encryption。"
        authored_by: samlier-g1-builder
        review:
          # state は起票側の記録。承認の正本は tests/approvals/g1.yaml
