      - key: IIP-IDP17.b
        roles: [idp]
        level: MUST
        testability: BROWSER
        condition: null
        summary_en: "Support the SAML V2.0 Asynchronous Single Logout Protocol Extension"
        summary_ja: "SAML V2.0 Asynchronous Single Logout Protocol Extension に対応"
        references_spec: SAML2ASLO
        reference_derivation: true
        reference_evidence:
          - spec: SAML2ASLO
            locator: "2 Single Logout Protocol Extension for Asynchronous Reques||3 Conformance"
            section_digest: "sha256:86a1bb5a71936307cfb6c7c0819ad72f064e64631690a87cd2487a9886edfb64"
            basis_ja: "session authority が async LogoutRequest を Core に従って処理し、request initiator へ LogoutResponse を返さない規則、および user-facing feedback の規則"
        level_assignment: { idp: full }
        source_clauses:
          - { start: 109, end: 184, digest: "sha256:b6bba3e952dad96c6632c22909623672579ec9b07b5b4dcf6e2b75beaf0cad2b", occurrences: 1 }
        required_variants:
          - id: v-b0c90d49f2
            description_ja: "有効な aslo:Asynchronous 付き LogoutRequest → 同じ identifier / SessionIndex の同期 LogoutRequest と同じ session determination / request validation が行われる"
          - id: v-d19a728b55
            description_ja: "署名が有効で sender を認証できるが、Destination 不一致または未知 SessionIndex の async request → response を返さず、対応する Core request processing に従って session へ誤適用しない"
        controls:
          - "★ §2.2 は Core §3.7.3.2 に従う処理を要求するが、Core の session 終了自体は SHOULD（IIP-IDP17.q）。『session が必ず終了する』を本 MUST の期待値にしない"
          - "★ request initiator conformance（async element を含める能力）と session authority conformance（受信処理）を区別する。IIP-IDP17.c が LogoutRequest propagation を OPTIONAL とするため、IdP に async request 発行 capability を追加要求しない"
          - "XML 署名検証に失敗した message では extension を信頼して response を抑止しない。IIP-IDP17.y / .z / .aa の Core signature-processing 経路を適用し、無応答・error 応答のどちらも本義務の violated にしない"
          - "response 禁止は IIP-IDP17.b1、feedback は .b2、対象が実際に発行した async request の placement は .b3 で分離する"
        authored_by: samlier-g1-builder
        review:
          # state は起票側の記録。承認の正本は tests/approvals/g1.yaml
          state: PENDING_REVIEW
