        configuration_failure_semantics: normative_capability
        summary_en: "Consume peer configuration values from metadata, without additional inputs, for every element identified as MUST or MAY in SAML2Prof 4.1.6 that corresponds to a supported setting"
        summary_ja: "SAML2Prof 4.1.6 で MUST/MAY とされた各メタデータ要素のうち、対象が対応する設定について、追加入力なしでメタデータから取り込む"
        references_spec: "SAML2Prof#4.1.6"
        reference_derivation: true
        reference_evidence:
          - spec: SAML2Prof
            locator: "4\\.1\\.6\\s+Use of Metadata||4\\.2\\s+Enhanced Client or Proxy"
            section_digest: "sha256:f52cb0fa5c1b269dc444637eee266c503ead00ad24b477e51b2a18281b6e9f29"
            basis_ja: "§4.1.6 の全文を読み、RFC2119 の MUST / MAY を伴う要素のみを列挙した"
        level_assignment: { idp: core, sp: core }
        source_clauses:
          - { start: 0, end: 376, digest: "sha256:7bf32b4a620f48a0a471abd2fe2b41640c95265faa6f315d2f92295ed3411cda", occurrences: 1 }
        required_variants:
          - id: v-03f60bb35b
            description_ja: "md:IDPSSODescriptor/@WantAuthnRequestsSigned — MAY be used by an identity provider to document a requirement that requests be signed"
          - id: v-7b96873711
            description_ja: "md:SPSSODescriptor/@AuthnRequestsSigned — MAY be used by a service provider to document the intention to sign all of its requests"
          - id: v-43efff0abe
            description_ja: "md:KeyDescriptor use=signing — providers MAY document the key(s) used to sign requests, responses, and assertions（Errata 05 E58 により sign→signing）"
          - id: v-4cac5e94f1
            description_ja: "md:KeyDescriptor use=encryption — MAY be used to document supported encryption algorithms and settings, and public keys（Errata 05 E58 により encrypt→encryption）"
          - id: v-87b1079472
            description_ja: "md:SPSSODescriptor/@WantAssertionsSigned — MAY be used by a service provider to document a requirement that assertions be signed"
          - id: v-a7d66b92a1
            description_ja: "md:ArtifactResolutionService — 条件付き MUST: HTTP Artifact バインディングで配送する場合、artifact issuer は少なくとも 1 つ提供しなければならない"
          - id: v-3b8c1d97c6
