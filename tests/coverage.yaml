            locator: "5 SAML and XML Signature Syntax and Processing||5\\.1 Signing Assertions"
            section_digest: "sha256:877fe41109f8098cade19fb76a3442188abba96eb1287c6ebe3930b921cd6b1c"
            basis_ja: "SAML2Core 5 は assertion と protocol message に直接置かれる <ds:Signature> の profile であり、SAML2Prof 4.1.4.1『All processing rules are as defined in [SAMLCore]』を通じて入る。ブラウザ等、発信者以外の entity を経由して届く protocol message は sender が署名すべきという一般 SHOULD"
        level_assignment: { sp: full }
        source_clauses:
