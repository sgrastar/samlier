            basis_ja: "正方向の根拠。§8.3.7『The element's SPProvidedID attribute MUST contain the alternative identifier of the principal most recently set by the service provider or affiliation, if any (see Section 3.6)』"
          - spec: SAML2Core
            locator: "3\\.6\\.1 Element <ManageNameIDRequest>||3\\.6\\.2 Element <ManageNameIDResponse>"
            section_digest: "sha256:24a8baecb61705b2532950a0779b5b778fe8f2a1352901d89f8c2ff5d6d656f9"
            basis_ja: "代替識別子の設定手段。§3.6.1『if the requester is the service provider, the new identifier MUST appear in subsequent <NameID> elements in the SPProvidedID attribute』。<NewID> は type=\"string\" なので IIP-G02.c の xs:string 往復にも使える"
        level_assignment: { idp: core }
        source_clauses:
          - { start: 0, end: 169, digest: "sha256:e66a1c4b4350bebadd4d4eea6620b79599bf4ccf39f39a3ea381665fbbc61d39", occurrences: 1 }
