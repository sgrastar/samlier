            basis_ja: "session participant は LogoutRequest を SAMLCore に従って MUST process する"
          - spec: SAML2Core
            locator: "3\\.7\\.3\\.1 Session Participant Rules||3\\.7\\.3\\.2 Session Authority Rules"
            section_digest: "sha256:d65da3e5e87d01a25303c9b32b66dcbfe9255952a8451fec7c0dcae60bb93cb9"
            basis_ja: "Subject が strong match し、SessionIndex が一致（または request に index なし）、assertion が time-valid、かつ LogoutRequest が未失効なら、request より後に到着した assertion にも logout を MUST apply する"
        level_assignment: { sp: full }
        source_clauses:
          - { start: 0, end: 109, digest: "sha256:284c8f09360551d5a9db48439f6d40890b67152fcf6a716c6885b468678edb80", occurrences: 1 }
        required_variants:
          - id: v-f75b3ebea1
            description_ja: "将来到着する assertion と strong match する identifier / SessionIndex を持つ未失効 LogoutRequest を先に受信 → 後着 assertion から session を確立・維持しない"
          - id: v-63ed18aece
            description_ja: "SessionIndex を含まない未失効 LogoutRequest → strong match する後着 assertion の全 SessionIndex に適用する"
          - id: v-af404ffc3c
            description_ja: "対照: identifier が strong match しない後着 assertion → 本 request だけを理由に拒否しない"
          - id: v-57262b384b
            description_ja: "対照: SessionIndex S1 だけを指定した未失効 LogoutRequest の後に、同じ principal だが SessionIndex S2 の assertion が到着 → 本 request だけを理由に拒否しない"
          - id: v-bba7d34c3c
            description_ja: "対照: LogoutRequest/@NotOnOrAfter 後に到着した assertion → 本 request だけを理由に拒否しない"
        controls:
          - "4 条件を全て満たす positive と、各条件を 1 つずつ崩す negative control を対にする。常に後着 assertion を拒否する実装を PASS にしない"
          - "LogoutRequest consumption 自体は IIP-SP14.c が OPTIONAL。未対応なら satisfied_with_note"
          - "後着 assertion の通常の有効性検証は SSO 義務で別に判定し、本義務の失敗と混同しない"
