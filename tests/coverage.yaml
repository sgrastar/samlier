      - key: IIP-IDP17.c
        roles: [idp]
        level: OPTIONAL
        testability: BROWSER
        condition: null
        summary_en: "Propagation of logout requests to other session participants is optional"
        summary_ja: "他のセッション参加者へのログアウト伝播は任意"
        references_spec: "SAML2Prof#4.4.3.2-4.4.3.3"
        reference_derivation: true
        reference_evidence:
          - spec: SAML2Prof
            locator: "4\\.4\\.3\\.2 Identity Provider Determines Session Participants||4\\.4\\.3\\.4 Session Participant/Authority Issues"
            section_digest: "sha256:63278989b849a7745848cf51017156ef9ebd1ad7f18cdbb2555b0038a4ea6d59"
            basis_ja: "§4.4.3.3 は『To propagate the logout』として IdP が session authority **or** participant へ LogoutRequest を送る手順を 1 つの propagation と定義する。IIP-IDP17.c はこの propagation 対応を OPTIONAL へ上書きする"
          - spec: SAML2Core
            locator: "3\\.7\\.3\\.2 Session Authority Rules||3\\.8 Name Identifier Mapping Protocol"
            section_digest: "sha256:d6baacdc29f4e54d86b0ac05b4baf97e170db7960b9e21ea0c3846b35d0cef23"
            basis_ja: "session authority rules の第 1 bullet は proxy 上流 authority、第 2 bullet は他 session participant への LogoutRequest。Profile §4.4.3.3 では両方を propagation と呼ぶ"
        level_assignment: { idp: full }
        source_clauses:
          - { start: 186, end: 273, digest: "sha256:7c03e19402eb4efe8a7fdc6cd0032febab56a0bfcde55e017f3a8363a30feda6", occurrences: 1 }
        required_variants:
          - id: v-fd339c5acb
            description_ja: "secondary_peer を 2 つ目の SP として登録し、下流 session participant への伝播が起きるかを情報として記録"
          - id: v-960dd4c1e7
            description_ja: "対象 IdP が authentication proxy として上流 session authority を使う構成で、上流 authority への伝播が起きるかを情報として記録"
          - id: v-73e09adb05
            description_ja: "伝播を実装する場合、対象 IdP が発行した LogoutRequest は IIP-IDP17.j〜.n の message 規則を満たす"
        controls:
          - "★ 伝播しない IdP は NOT_SUPPORTED であり、IIP-IDP17.a の FAIL にしない"
          - "★ SAML2Prof §4.4.3.1 の『IdP SHOULD then propagate』および §4.4.3.2 の steps 3 / 4 は、より具体的な IIP-IDP17.c の OPTIONAL により本カタログでは任意機能として扱う"
          - "★ Core の厳密な actor 名では上流は session authority であるが、Profile §4.4.3.3 が authority / participant の両送信を同じ『propagate the logout』手順に置く。IIP の『propagation ... to other session participants』を下流 participant だけに狭め、上流送信を SHOULD として復活させると、IIP が意図した propagation capability の任意化を迂回するため、両経路を本 OPTIONAL に含める"
          - "★ IdP-initiated SLO も Profile の permission であり、本 OPTIONAL 機能を実装しないことを違反にしない"
        authored_by: samlier-g1-builder
        review:
