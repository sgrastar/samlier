            locator: "4\\.1\\.5 Unsolicited Responses||4\\.1\\.6 Use of Metadata"
            section_digest: "sha256:a689690247226858fd22a247b13eca3d6f328a09ea653927276c11f433a7e0ce"
            basis_ja: "改訂前の §4.1.5 直後（E90 が新 §4.1.6 を挿入する位置）"
          - spec: SAML2Errata
            locator: "E90: RelayState sanitization||E91: "
            section_digest: "sha256:43284ad0a9667e8f534ac490f5b2b02a4e32bb558a64a1545f9b87b3255cb339"
            basis_ja: "E90 が [SAMLProf] に追加する新 §4.1.6『Use of Relay State』。『The URL scheme eventually derived SHOULD be limited to \"https\" or \"http\", and protection against unencoded executable content must be applied』"
        level_assignment: { idp: full, sp: full }
        source_clauses:
          - { start: 0, end: 125, digest: "sha256:ff1057626aaa898cc4a76e1e0e4e9f6ad908c018ad60ce09d95e71634b08fac5", occurrences: 1 }
        required_variants:
