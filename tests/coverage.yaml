      - key: IIP-SSO01.dp
        roles: [idp]
        level: MUST
        testability: AUTOMATED
        condition: null
        summary_en: "For an encrypted identifier, the ciphertext must be unique to any given encryption operation"
        summary_ja: "<saml:EncryptedID> の暗号文は、暗号化操作ごとに一意である"
        references_spec: "SAML2Prof#4.1"
        reference_derivation: true
        reference_evidence:
          - spec: SAML2Core
            locator: "2\\.2\\.4 Element <EncryptedID>||2\\.2\\.5 Element <Issuer>"
            section_digest: "sha256:c2759accf22d26943821d2a3674cec0a26dd4ca41f96aed344506d356bfb6ac0"
            basis_ja: "SAML2Prof 4.1.4 の『This profile is based on the Authentication Request protocol defined in [SAMLCore]』および 4.1.3.5 の取り込み句により、assertion の生成・処理に関する SAML2Core の規則が入る。<EncryptedID> の節にのみ置かれた規則。『Encrypted identifiers are intended as a privacy protection mechanism when the plain-text value passes through an intermediary. As such, the ciphertext MUST be unique to any given encryption operation』"
        level_assignment: { idp: core }
        source_clauses:
          - { start: 0, end: 125, digest: "sha256:ff1057626aaa898cc4a76e1e0e4e9f6ad908c018ad60ce09d95e71634b08fac5", occurrences: 1 }
        required_variants:
          - id: v-2bae957fc4
            description_ja: "同じ persistent NameID を 2 回暗号化させる → <saml:EncryptedID> の <xenc:CipherValue> が毎回異なる"
          - id: v-46c83eb407
            description_ja: "同一主体・同一 SP で連続して SSO → 毎回異なる暗号文になる"
          - id: v-aaa8cae195
            description_ja: "対照: 平文が異なれば当然異なる（この対照だけでは決定的暗号を検出できない）"
        controls:
          - "★ 検出力の要: **同一の平文**を 2 回暗号化させないと、決定的な暗号化（同じ IV / ECB）を検出できない。transient NameID は毎回変わるので平文が変わってしまう。persistent NameID を使う"
          - "★ 訂正: 前版は『暗号文一般』の義務にしていたが、この MUST は **<EncryptedID>（§2.2.4）にだけ置かれた規則**である。§2.3.4 <EncryptedAssertion> と §2.7.3.2 <EncryptedAttribute> に同じ文はない。対象を <EncryptedID> に限定した"
          - "★ <EncryptedAssertion> / <EncryptedAttribute> の暗号文の一意性は [XMLEnc] 側の問題であり、IIP-SSO01 が取り込む範囲ではないので advisory として記録する"
          - "★ 受動規則として扱う。対象が実際に送出した該当要素ごとに検査し、当該 Run で 1 件も観測されなければ satisfied_with_note（観測機会なし）とする。**条件述語を置かない**: 肯定的な観測材料しか作れない CAPABILITY_BASED 述語では『機能を持たない』ことを FALSE にできず（申告のみの false は UNKNOWN）、非対応の対象が永久に not_verified になる。IIP-SSO01.er 等と同じ扱いに揃えた"
          - "★ この規則は IV の再利用という実際の脆弱性に対応する"
