      - key: IIP-SSO01.eu
        roles: [idp, sp]
        level: MUST
        testability: AUTOMATED
        condition: null
        summary_en: "SAML assertions and protocol messages must supply a value for the ID attribute on the root element being signed"
        summary_ja: "対象が署名する assertion / プロトコルメッセージのルート要素に ID 属性の値を与える"
        references_spec: "SAML2Prof#4.1"
