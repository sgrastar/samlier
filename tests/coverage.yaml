      - key: IIP-SSO05.a6
        roles: [idp]
        level: MUST
        testability: CONFIG
        condition:
          predicate: reissues_foreign_persistent_identifier
          predicate_kind: CAPABILITY_BASED
        configuration_failure_semantics: test_precondition
        summary_en: "When re-issuing an identifier created by another entity, NameQualifier must continue to identify the entity that originally created it"
        summary_ja: "他エンティティが生成した persistent 識別子を再発行する場合、NameQualifier は元の生成者を指し続ける"
        references_spec: "SAML2Core#8.3.7"
        reference_derivation: true
        reference_evidence:
          - spec: SAML2Core
            locator: "8\\.3\\.7 Persistent Identifier||8\\.3\\.8 Transient Identifier"
            section_digest: "sha256:6add1e8cf39e4ece3e97563d6877daefe876ee1c20dd2c9fc253f8562a69de9e"
            basis_ja: "§8.3.7 の当該文は 'Note that a different system entity might later issue...' で始まるが、MUST / MUST NOT を含むため規範として扱う。IIP-SSO05 が §8.3 の normative obligations を取り込むため対象になる"
        level_assignment: { idp: core }
        source_clauses:
          - { start: 0, end: 169, digest: "sha256:e66a1c4b4350bebadd4d4eea6620b79599bf4ccf39f39a3ea381665fbbc61d39", occurrences: 1 }
          - { start: 170, end: 222, digest: "sha256:200d6cc58795ef10f294b4748ce9f9f493f02626e206d1d73490711ce8f2561a", occurrences: 1 }
        required_variants:
          - id: v-cad20b6af1
            description_ja: "Samlier を上流 IdP・対象を Proxy・Samlier を下流 SP に置き、上流が発行した persistent NameID を対象が再発行する"
          - id: v-020855ffa9
            description_ja: "再発行された NameID の NameQualifier が上流 Samlier-IdP の entityID のまま（対象自身の entityID に書き換わっていない）"
          - id: v-045afbcd40
            description_ja: "対照: 対象が自前の persistent 識別子を新規生成して返す構成では NameQualifier は対象自身になる。これを FAIL にしない"
        controls:
          - "★ 『NameQualifier == 応答を送ってきた IdP の entityID』を無条件に期待する検査は、この再発行ケースを誤判定する"
          - "★ 上流 Samlier-IdP と下流 Samlier-SP の 2 役を同一 Test Plan の Test Peer で演じる。testability を CONFIG にしているのは対象側の再構成が前提になるため。実行時にはブラウザ操作も要る"
          - "★ 対象が Proxy として振る舞えない場合は条件が偽 → NOT_APPLICABLE。構成できないだけの場合は not_verified"
        notes_ja: "原文の当該文は Note that で始まるが MUST / MUST NOT を含む。同段落末尾の「Finally, note that ...」は RFC2119 キーワードを含まない再説明なので義務を起こさない。"
