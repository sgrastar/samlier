            locator: "5\\.4\\.1 Signing Formats and Algorithms||5\\.4\\.2 References"
            section_digest: "sha256:f2f97985fe36022114862dc8d7539c7d623206b08c052e203dd6f2fe8c3f7b69"
            basis_ja: "SAML2Core 5 は assertion と protocol message に直接置かれる <ds:Signature> の profile であり、SAML2Prof 4.1.4.1『All processing rules are as defined in [SAMLCore]』を通じて入る。『SAML assertions and protocols MUST use enveloped signatures when signing assertions and protocol messages』"
        level_assignment: { idp: core, sp: core }
        source_clauses:
          - { start: 0, end: 125, digest: "sha256:ff1057626aaa898cc4a76e1e0e4e9f6ad908c018ad60ce09d95e71634b08fac5", occurrences: 1 }
