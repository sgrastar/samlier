  - id: IIP-IDP07
    section: 4.1
    section_name: "Identity Provider / Web Browser SSO"
    anchor: "#IIP-IDP07"
    source_section_digest: "sha256:50adf1500e90078d332a3aa499622764cff2bfe7f62689e9699d3d6541ea16fe"
