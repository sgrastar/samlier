    non_normative_spans:
      - { start: 76, end: 295 }
      - { start: 296, end: 421 }
    obligations:
      - key: IIP-SP04.a
        roles: [sp]
        level: MUST
        testability: BROWSER
        condition: null
        summary_en: "Support the IdP Discovery redirect protocol end to end as a Service Provider"
        summary_ja: "Service Provider として IdP Discovery のリダイレクトプロトコルを一連で処理できる"
        references_spec: IdPDisco
        reference_derivation: true
        reference_evidence:
          - spec: IdPDisco
            locator: "2\\.4 Conformance||2 Identity Provider Discovery Protocol and Profile"
            section_digest: "sha256:991ae4a835505a82ae2f97519dd2527532183da7e978afc28e7550386d8fd749"
            basis_ja: "適合 SP は section 2 のうち SP の振る舞いに関する規範文へ適合しなければならない。"
          - spec: IdPDisco
            locator: "2\\.4 Protocol Description||2\\.4\\.1 HTTP Request to Discovery Service"
            section_digest: "sha256:3597821d543378da7d36cec46525ebb937652375cf8e2d87960661e43904e907"
            basis_ja: "規範的な二つの message exchange の第 1 段階として、SP が UA を Discovery Service へリダイレクトする。"
          - spec: IdPDisco
            locator: "2\\.4\\.3 HTTP Redirect to Service Provider||2\\.5 Use of Metadata"
            section_digest: "sha256:e4e42f8958bf904ea2195de4e633b8997fa50cd854f25d016565e869a5e3e0ca"
            basis_ja: "Discovery Service が選択結果または空の結果を SP へ返す第 2 の message exchange。"
        level_assignment: { sp: full }
        source_clauses:
          - { start: 0, end: 75, digest: "sha256:ce8bdccd17ea2f66dcbdaaf5b60241115ca8b6c3fb1bc9eb3f4cc468d61dad1b", occurrences: 1 }
        required_variants:
          - id: v-30f2c7f165
            description_ja: "Suite が Discovery Service を演じる。対象 SP が UA を DS へリダイレクトし、DS が返した選択済み IdP の entityID を受けて SSO を継続できる"
          - id: v-a45da3e7a4
            description_ja: "返却 URL に実効 returnIDParam 名の parameter が存在しない場合、それを選択済み IdP の識別子が返ったものとして扱わない"
        controls:
          - "成功結果と空の結果を対にする。成功だけでは返却パラメータを読まず既定 IdP を使う実装を検出できない"
          - "選択結果がない後の振る舞い（製品自身の IdP 選択 UI、既定 IdP への遷移、エラー表示等）は IdPDisco が規定していないため verdict 対象にしない"
          - "IdPDisco section 2 の DS 主体の MUST/SHOULD（isPassive 時の UI、返送方法、metadata 照合等）は Test Peer である Suite 側の fixture 規則であり、対象 SP の義務にはしない"
          - "return / policy / returnIDParam / isPassive の MAY は利用許可であって全機能の提供能力を SP に要求しない。実際に選んだ経路へ適用される MUST/MUST NOT だけを .b〜.i で判定する"
        notes_ja: "非規範の IIP 注記により、製品固有の discovery UI の実装までは要求されず、IdPDisco の単純なリダイレクト規約への対応が対象である。IdPDisco の SP 向け規範内容は .b〜.i に分解した。Discovery Service 主体の規範文と、SP が使ってよい任意パラメータは対象 SP の独立義務にしていない。IIP 注記の『discovery mechanisms SHOULD use SAML metadata…』もイタリック＝非規範なので、独立義務にしない。"
        authored_by: samlier-g1-builder
        review:
          # state は起票側の記録。承認の正本は tests/approvals/g1.yaml
          state: PENDING_REVIEW
          reviewer: null
          approved_at: null
          obligation_digest: "sha256:86c789a75ac97cc20828bd2591d0e080fecf0d6895de4045b9458b0e5db92e40"
          source_spec: kantara-fedinterop-impl
          spec_version: "1.1"
          source_selector: "#IIP-SP04"
          source_section_digest: "sha256:9f4cd8b6cb558613561d9a402eae520faf7df2d78a2132cd7c6b89cf5cda07cf"
      - key: IIP-SP04.b
        roles: [sp]
        level: MUST
        testability: BROWSER
        condition: null
        summary_en: "Initiate the Discovery Protocol by redirecting the user agent to the Discovery Service with HTTP GET"
        summary_ja: "UA を HTTP GET で Discovery Service へリダイレクトして Discovery Protocol を開始する"
        references_spec: IdPDisco
        reference_derivation: true
        reference_evidence:
          - spec: IdPDisco
