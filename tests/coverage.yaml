            basis_ja: "E90 は [SAMLProf] §4.1.5 にも追記する。『Service providers SHOULD have a means of disabling the acceptance of unsolicited responses if circumstances warrant』。IIP-SSO01 は [SAML2Prof] を 『as updated by [SAML2Errata]』で取り込むため、この追記は規範として適用される"
