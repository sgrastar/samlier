        references_spec: "SAML2Prof#4.1"
        reference_derivation: true
        reference_evidence:
          - spec: SAML2Errata
            locator: "E93: Mitigation for XML Encryption CBC deficiencies||E94: "
            section_digest: "sha256:3c0a2fdac7b0451cae65b8c194e98e795dc07c6be5e8f31277ce8d67cefece57"
            basis_ja: "SAML2Prof 4.1.3.5 の『The service provider MUST process the <Response> message and any enclosed <Assertion> elements as described in [SAMLCore]』により取り込まれる。置換後 Core 6.2『when CBC-mode algorithms are used ... relying parties SHOULD require the presence of integrity protection before processing encrypted SAML assertions or assertions containing encrypted data』"
        level_assignment: { sp: full }
        source_clauses:
          - { start: 0, end: 125, digest: "sha256:ff1057626aaa898cc4a76e1e0e4e9f6ad908c018ad60ce09d95e71634b08fac5", occurrences: 1 }
