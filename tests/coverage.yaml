      - key: IIP-IDP17.a
        roles: [idp]
        level: MUST
        testability: BROWSER
        condition: null
        summary_en: "Support the SAML V2.0 SingleLogout profile"
        summary_ja: "SAML V2.0 SingleLogout profile に対応"
        references_spec: "SAML2Prof#4.4 + SAML2Core#3.7"
        reference_derivation: true
        reference_evidence:
          - spec: SAML2Prof
            locator: "4\\.4 Single Logout Profile||4\\.5 Name Identifier Management Profile"
            section_digest: "sha256:e18e43026d7f95e4286e93a5ae0e73ff9f6763ed65ea2a2ef34875a179885003"
            basis_ja: "IdP が session authority として SP-initiated SLO を処理し、元の requester へ応答する基本フロー"
          - spec: SAML2Errata
            locator: "E38: Clarification Regarding Index on <LogoutRequest>||E39: "
            section_digest: "sha256:2624d378f1c53ab428abfe211283c309b61fd3b5ef05a5bf51185001f48461d2"
            basis_ja: "§4.4.4.1 の SessionIndex 規則を明確化する。IdP は受信した participant request の SessionIndex を処理する"
          - spec: SAML2Core
            locator: "3\\.7 Single Logout Protocol||3\\.8 Name Identifier Mapping Protocol"
            section_digest: "sha256:a7b444a729dd7b9e3cf3570c1218043f519367d021b113fe7690e3ff98a59ade"
            basis_ja: "§4.4.3.2 の『processes the request as defined in [SAMLCore]』が取り込む session authority rules と underlying message rules。CP2b-Core で分解する"
        level_assignment: { idp: full }
        source_clauses:
          - { start: 0, end: 107, digest: "sha256:0649b5f4937ddaf054925804c5e79e1c7260aeb6704060d2eb256754a88010f5", occurrences: 1 }
        required_variants:
          - id: v-5cb9a47fbe
            description_ja: "SP が aslo:Asynchronous を含まない妥当な LogoutRequest を送る → identifier / SessionIndex を調べ、元 SP へ LogoutResponse を返す。session 終了の SHOULD と status 分岐は IIP-IDP17.e / .o / .q で判定する"
        controls:
          - "★ §4.4.2 は IdP が profile を step 2 から開始できる（can initiate）とするだけで、IdP-initiated SLO capability を MUST にしない"
          - "★ 他 session participant への伝播は IIP-IDP17.c が OPTIONAL と明示する。§4.4.3.1 / .2 の propagation SHOULD / 手順 3・4 を無条件の義務へ戻さない"
          - "★ 基本フローは SP-initiated request の受信・session determination・元 requester への response。request binding と response binding の能力は IIP-IDP18 が別途判定する"
        notes_ja: "CP2b で §4.4 全体と Errata E38、Core §3.7 と underlying request / response rules を actor 別に照合した。IdP-initiated 開始は permission、他参加者への propagation は IIP で明示的に OPTIONAL なので、IdP の必須 capability に含めない。Core の共通データ型・生成側 XML Signature profile・extension namespace は、全 SAML message を横断対象にする既存義務 IIP-SSO01.dz / .ea / .eb / .ec / .ed / .ee / .ef / .eg / .eh / .ei / .er / .eu / .ev / .ew / .ex / .ah が SLO message も受動検査するため二重計上しない。IdP 発行 LogoutResponse の top-level StatusCode は IIP-IDP17.an で判定する。SLO の actor / direction で結果が変わる規則だけ .d 以降へ分解した。"
        authored_by: samlier-g1-builder
