      - key: IIP-IDP17.e
        roles: [idp]
        level: MUST
        testability: BROWSER
        condition:
          predicate: supports_slo_idp
          predicate_kind: CAPABILITY_BASED
        summary_en: "For a response-bearing request, if the identity provider successfully terminates its own session, return a LogoutResponse with top-level Success"
        summary_ja: "response を伴う request で IdP 自身に関する session を正常終了した場合、top-level Success の LogoutResponse を返す"
        references_spec: "SAML2Prof#4.4.3.5 + SAML2Core#3.7.3.2"
        reference_derivation: true
        reference_evidence:
          - spec: SAML2Prof
