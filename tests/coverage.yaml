            basis_ja: "SAML2Prof 4.1.3.3 の『The identity provider MUST process the <AuthnRequest> message as described in [SAMLCore]』および 4.1.4.1 の『All processing rules are as defined in [SAMLCore]』により取り込まれる。『The <AuthnRequest> message SHOULD be signed or otherwise authenticated and integrity protected by the protocol binding used to deliver the message』"
