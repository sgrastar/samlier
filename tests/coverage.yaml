            description_ja: "対象が付ける <ds:Signature> が署名対象要素の子であり、enveloped-signature transform を含む"
          - id: v-b5451cd21c
            description_ja: "enveloping 署名（<ds:Object> に対象を入れる形式）を使っていない"
          - id: v-9e30363ca6
            description_ja: "detached 署名（対象が署名の外にある形式）を使っていない"
