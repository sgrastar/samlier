        required_variants:
          - id: v-9957aefbae
            description_ja: "HTTP-Redirect / HTTP-POST でブラウザ経由する AuthnRequest → XML 署名または binding 固有署名で保護される"
          - id: v-c2ec4670c4
            description_ja: "HTTP-Redirect バインディングではクエリ署名でもよい（[SAML2Bind] の署名機構）"
          - id: v-1bda8953c7
            description_ja: "HTTP-Artifact では artifact 解決の同期 binding が送信者認証と完全性保護を提供すれば、AuthnRequest の XML 署名は不要"
