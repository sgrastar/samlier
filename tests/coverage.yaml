            section_digest: "sha256:66f8b6395cf2a98fac582deb906fb9318847eb91170b5001bb24d73b2d243b66"
            basis_ja: "根拠は §3.4.1.4 の『The responder MUST ultimately reply to an <AuthnRequest> with a <Response> message containing one or more assertions that meet the specifications defined by the request, or with a <Response> message containing a <Status> describing the error that occurred』。NameIDPolicy は『the specifications defined by the request』の一部であり、満たすか誤り応答を返すかの二択になる。§3.4.1 が『See Section 3.4.1.4 for general processing rules』と述べるため、IIP-IDP10 の『as defined in [SAML2Core]』に含まれる"
          - spec: SAML2Core
            locator: "3\\.4\\.1\\.4 Processing Rules||3\\.4\\.1\\.5 Proxying"
            section_digest: "sha256:66f8b6395cf2a98fac582deb906fb9318847eb91170b5001bb24d73b2d243b66"
            basis_ja: "補強。同節の『the resulting assertions' <saml:Subject> MUST strongly match the request <saml:Subject>, ... except that the identifier MAY be in a different format if specified by <NameIDPolicy>』は、識別子の形式が <NameIDPolicy> によって決まることを前提にしている"
        level_assignment: { idp: core }
        source_clauses:
