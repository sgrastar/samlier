      - key: IIP-SP14.z
        roles: [sp]
        level: MUST
        testability: BROWSER
        condition: null
        summary_en: "Apply an unexpired LogoutRequest to a matching authentication assertion even when the assertion arrives after the request"
        summary_ja: "未失効 LogoutRequest の後から到着した matching authentication assertion にも logout を適用する"
        references_spec: "SAML2Prof#4.4.3.4 + SAML2Core#3.7.3.1"
        reference_derivation: true
        reference_evidence:
          - spec: SAML2Prof
            locator: "4\\.4\\.3\\.4 Session Participant/Authority Issues <LogoutResponse> to Identity||4\\.4\\.3\\.5 Identity Provider Issues"
