      - key: IIP-SSO01.av
        roles: [idp, sp]
        level: MUST
        testability: CONFIG
        condition:
          predicate: emits_idplist_getcomplete
          predicate_kind: CAPABILITY_BASED
        configuration_failure_semantics: test_precondition
        summary_en: "Retrieving the resource associated with a GetComplete URI must result in an XML instance whose root element is an IDPList that does not itself contain a GetComplete element"
        summary_ja: "<GetComplete> の URI から取得される XML は、ルートが <IDPList> で、<GetComplete> を含まない"
        references_spec: "SAML2Prof#4.1"
        reference_derivation: true
        reference_evidence:
          - spec: SAML2Core
            locator: "3\\.4\\.1\\.3 Element <IDPList>||3\\.4\\.1\\.4 Processing Rules"
            section_digest: "sha256:4399e688c7aa74382dddfd4253cfb8da016eff0d6ab2f7de9be43677a6d23cc7"
            basis_ja: "SAML2Prof 4.1.3.3 の『The identity provider MUST process the <AuthnRequest> message as described in [SAMLCore]』および 4.1.4.1 の『All processing rules are as defined in [SAMLCore]』により取り込まれる。『Retrieving the resource associated with the URI MUST result in an XML instance whose root element is an <IDPList> that does not itself contain a <GetComplete> element』"
        level_assignment: { idp: core, sp: core }
        source_clauses:
          - { start: 0, end: 125, digest: "sha256:ff1057626aaa898cc4a76e1e0e4e9f6ad908c018ad60ce09d95e71634b08fac5", occurrences: 1 }
        required_variants:
          - id: v-7040c02ba2
            description_ja: "対象が発行した <GetComplete> の URI を取得 → ルート要素が <samlp:IDPList> である"
          - id: v-02d9b080a5
            description_ja: "その <IDPList> が <samlp:GetComplete> を含まない（再帰しない）"
          - id: v-aba70ca936
            description_ja: "取得した <IDPList> が 1 つ以上の <samlp:IDPEntry> を持つ（スキーマ上必須）"
        controls:
          - "★ <GetComplete> を発行しない対象では条件が偽 → NOT_APPLICABLE"
          - "★ role には idp も含む。プロキシ IdP は新 <AuthnRequest> に <IDPList>/<GetComplete> を載せうる（IIP-SSO01.bc）"
          - "★ 訂正: 前版は到達不能を一律 not_verified にしていたが、それでは壊れた URI を隠してしまう。次のように切り分ける:"
          - "   (1) Suite に外向き通信がない／プロキシ制限で到達できない → not_verified(suite_egress_restricted)"
          - "   (2) Suite は他ホストへ到達できるのに当該 URI が 404・接続拒否・TLS 失敗 → violated（『Retrieving the resource ... MUST result in an XML instance』を満たしていない）"
          - "   (3) 取得できたが XML でない・ルートが <IDPList> でない・<GetComplete> を含む → violated"
          - "★ (1) と (2) を区別するため、preflight で既知の到達可能ホストへの疎通を先に確認しておく"
          - "★ 取得は Suite の outbox 経由で行い、リダイレクト追従とサイズ上限を Runner 側で制限する"
