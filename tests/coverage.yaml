      - key: IIP-SSO01.ab
        roles: [idp, sp]
        level: SHOULD
        testability: BROWSER
        condition:
          predicate: derives_url_from_relaystate
          predicate_kind: CAPABILITY_BASED
        summary_en: "The URL scheme eventually derived from RelayState should be limited to https or http"
        summary_ja: "[E90] RelayState から最終的に導出する URL scheme は https / http に限ることが望ましい"
        references_spec: "SAML2Prof#4.1"
        reference_derivation: true
        reference_evidence:
