            section_digest: "sha256:f2422dd65301e4ab01937d216a5a05193517484b86b7ba23e959ef242d2ed9c2"
            basis_ja: "IdP は original request に適切な status code を含む LogoutResponse で MUST respond する"
          - spec: SAML2Core
            locator: "3\\.7\\.3\\.2 Session Authority Rules||3\\.8 Name Identifier Mapping Protocol"
            section_digest: "sha256:d6baacdc29f4e54d86b0ac05b4baf97e170db7960b9e21ea0c3846b35d0cef23"
            basis_ja: "session authority が自身に関する session を正常終了した場合は top-level Success、できなければ error status を MUST return する"
        level_assignment: { idp: full }
        source_clauses:
