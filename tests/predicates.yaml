# tests/predicates.yaml — 条件述語の固定集合（G1 成果物）
# 生成: build_g1.py / 手編集しない
generated_at: 2026-08-26T18:46:42+00:00
schema_version: 1
# kind: CLAIM_BASED      = 申告そのものが条件（observed 不要）
#       CAPABILITY_BASED = 実際の能力が条件（observed 必須。declaration-only FALSE は UNKNOWN）
#       CLASSIFICATION_BASED = 製品分類が条件（declaration_only_exclusion のみ FALSE 可）
predicates:
  claims_mdq_support:
    kind: CLAIM_BASED
    description_ja: "対象が MDQ 対応を表明しているか"
    declared:
      - declared_features.mdq
    observed: []
    on_conflict: inconsistent
    rationale_ja: "原文が 'Implementations that claim support for this protocol' と述べており、申告そのものが条件"
  supports_outbound_encryption:
    kind: CAPABILITY_BASED
    description_ja: "対象が outbound 暗号化に対応しているか"
    declared:
      - declared_features.assertion_encryption
    observed:
      - "target_emitted: saml:EncryptedAssertion"
      - "target_emitted: saml:EncryptedID"
      - "target_emitted: saml:EncryptedAttribute"
    on_conflict: inconsistent
    rationale_ja: "原文は 'If an implementation supports outbound encryption'。★ 観測は方向付きでなければならない: 対象が *送信した* 暗号要素のみが証拠になる。対象メタデータの KeyDescriptor use=encryption は『暗号文を受信・復号できる』証拠であって outbound 生成能力の証拠ではないため使わない"
  claims_slo_support_sp:
    kind: CLAIM_BASED
    description_ja: "SP が SLO profile への対応を表明しているか"
    declared:
      - declared_features.single_logout
    observed: []
    on_conflict: inconsistent
    rationale_ja: "原文が 'Service Providers that claim support for this profile'。申告が真理値そのもの"
  supports_slo_sp:
    kind: CAPABILITY_BASED
    description_ja: "SP が実際に SLO profile に対応しているか"
    declared:
      - declared_features.single_logout
    observed:
      - "target_metadata_has: md:SPSSODescriptor/md:SingleLogoutService"
      - "target_emitted: samlp:LogoutRequest"
      - "target_consumed: samlp:LogoutRequest"
    on_conflict: inconsistent
    rationale_ja: "原文は 'Service Providers that support the ... profile'（claim ではない）ため CAPABILITY_BASED"
  supports_cbc:
    kind: CAPABILITY_BASED
    description_ja: "対象が AES-CBC ブロック暗号に対応しているか"
    declared:
      - declared_features.cbc
    observed:
      - "target_emitted_encryption_method: aes128-cbc"
      - "target_emitted_encryption_method: aes256-cbc"
      - "target_accepted_encryption_method: aes128-cbc"
      - "target_accepted_encryption_method: aes256-cbc"
    on_conflict: inconsistent
    rationale_ja: "IIP-ALG05.b の条件。CBC 非対応なら NOT_APPLICABLE であって違反ではない"
  peer_declares_algorithm_support:
    kind: CAPABILITY_BASED
    description_ja: "ピア（Samlier）のメタデータがアルゴリズム対応を宣言しているか"
    declared: []
    observed:
      - "suite_metadata_variant_declares_alg: true"
    on_conflict: inconsistent
    rationale_ja: "IIP-MD10 の 'If a SAML peer has declared algorithm support'。Suite 側の構成で決まるため常に決定可能"
  setting_supported_by_implementation:
    kind: CAPABILITY_BASED
    description_ja: "当該メタデータ要素に対応する設定を対象が備えているか"
    declared:
      - declared_features.supported_settings
    observed:
      - "target_behaviour_changed_on_metadata_edit: true"
    on_conflict: inconsistent
    rationale_ja: "IIP-SSO06 の (b) 'corresponds to settings supported by the implementation'。要素ごとに評価する"
  not_token_translation_proxy:
    kind: CLASSIFICATION_BASED
    description_ja: "対象が token translation Proxy ではないか"
    declared:
      - target.kind
    observed: []
    on_conflict: inconsistent
    declaration_only_exclusion:
      allowed: true
      requires_reason: true
      statement_en: "The target was declared to be a token translation Proxy, to which IIP-IDP13 does not apply. This was not verified by the Suite."
    rationale_ja: "IIP-IDP13 末尾の 'This requirement does not apply to token translation Proxies.'。観測材料が存在しないため明示的な除外申告のみが FALSE を作れる"
  supports_name_identifier_management:
    kind: CAPABILITY_BASED
    description_ja: "対象が SAML2Core 3.6 の Name Identifier Management に対応しているか"
    declared:
      - declared_features.name_identifier_management
    observed:
      - "target_metadata_has: md:IDPSSODescriptor/md:ManageNameIDService"
      - "target_consumed: samlp:ManageNameIDRequest"
      - "target_emitted: samlp:ManageNameIDResponse"
    on_conflict: inconsistent
    rationale_ja: "IIP-SSO05.a5 の条件。SAML2Core 8.3.7 の SPProvidedID は『SP が設定した代替識別子』を前提とし、その設定手段が §3.6 しかない。★ 観測は方向付き: 対象が ManageNameIDRequest を *受理し* ManageNameIDResponse を *返した* ことが能力の証拠。メタデータの ManageNameIDService だけでは宣言であって能力の観測ではないが、IIP-MD01 が『メタデータは実際の設定を反映する』ことを求めるため補助証拠として採る"
  proxies_to_non_saml_provider:
    kind: CAPABILITY_BASED
    description_ja: "対象が非 SAML の上流 provider へプロキシするか"
    declared:
      - declared_features.non_saml_upstream
    observed:
      - "target_emitted_authenticating_authority_not_in_saml_metadata: true"
    on_conflict: inconsistent
    rationale_ja: "SAML2Core 3.4.1.5.1 の一部の規範句は『If the authenticating identity provider is not a SAML identity provider』が明示的な条件。SAML IdP にしかプロキシしない対象には適用されないので NOT_APPLICABLE。★ supports_authnrequest_proxying だけを条件にすると、SAML IdP のみへプロキシする対象で『空虚に真』として満足扱いになってしまう。観測は方向付き: 対象が <saml:AuthenticatingAuthority> に、SAML メタデータで解決できない値を入れたことが証拠"
  uses_random_identifier_generation:
    kind: CAPABILITY_BASED
    description_ja: "対象が識別子の生成に乱数・擬似乱数を用いるか"
    declared:
      - declared_features.random_id_generation
    observed:
      - "target_emitted_identifiers_are_high_entropy: true"
    on_conflict: inconsistent
    rationale_ja: "SAML2Core 1.3.4 の衝突確率・seed に関する規範句は『In the case that a random or pseudorandom technique is employed』が条件。連番やハッシュ由来など非乱数方式の実装には適用されない。★ 非乱数方式でも 1.3.4 の『negligible probability』（IIP-SSO01.af / .ao）と『exactly one declaration』（IIP-SSO01.cc）は無条件に適用される"
  supports_authnrequest_proxying:
    kind: CAPABILITY_BASED
    description_ja: "対象が <AuthnRequest> のプロキシ（proxying identity provider）として振る舞うか"
    declared:
      - declared_features.authnrequest_proxying
    observed:
      - "target_emitted_authnrequest_to_upstream_idp: true"
      - "target_emitted: saml:AuthenticatingAuthority"
    on_conflict: inconsistent
    rationale_ja: "SAML2Core 3.4.1.5.1 の規範句はすべて『プロキシする場合』が前提。『An identity provider MAY proxy an <AuthnRequest> ...』とあるとおりプロキシ自体は任意なので、プロキシしない対象では NOT_APPLICABLE。★ 観測は方向付き: 対象が上流 IdP へ自分名義の <AuthnRequest> を送出したこと、または自分の assertion に <saml:AuthenticatingAuthority> を入れたことだけが証拠になる"
  emits_idplist_getcomplete:
    kind: CAPABILITY_BASED
    description_ja: "対象が <samlp:IDPList>/<samlp:GetComplete> を発行するか"
    declared:
      - declared_features.idplist_getcomplete
    observed:
      - "target_emitted: samlp:GetComplete"
    on_conflict: inconsistent
    rationale_ja: "SAML2Core 3.4.1.3 の『Retrieving the resource associated with the URI MUST result in ...』は GetComplete を発行した側が用意する資源への規範。発行しない対象では NOT_APPLICABLE"
  unsolicited_acs_from_metadata:
    kind: CAPABILITY_BASED
    description_ja: "対象が unsolicited <Response> を発行し、かつその配送先 ACS をメタデータから決めるか"
    declared:
      - declared_features.idp_initiated_sso
      - declared_features.metadata_driven_acs
    observed:
      - "target_emitted_unsolicited_response: true"
      - "target_used_metadata_acs_for_unsolicited: true"
    on_conflict: inconsistent
    rationale_ja: "SAML2Prof 4.1.5 の『If metadata as specified in [SAMLMeta] is used, the <Response> or artifact SHOULD be delivered to the <md:AssertionConsumerService> endpoint ... designated as the default』は **2 つの条件の連言**（unsolicited を発行する ∧ ACS 決定にメタデータを使う）。★ 片方だけでは適用されない。unsolicited を出すがメタデータを使わず ACS を決める IdP にはこの SHOULD は課されないため、1 つの述語に連言として畳んでいる。観測は方向付き: 対象が unsolicited <Response> を送出し、その宛先がメタデータの ACS と一致したことが証拠"
  derives_url_from_relaystate:
    kind: CAPABILITY_BASED
    description_ja: "対象が RelayState の値から遷移先 URL を導出するか"
    declared:
      - declared_features.relaystate_as_url
    observed:
      - "target_redirected_user_agent_to_relaystate_value: true"
    on_conflict: inconsistent
    rationale_ja: "SAML2Errata E90 が追加する [SAMLProf] 新 §4.1.6 は『The URL scheme eventually derived SHOULD be limited to \"https\" or \"http\"』と述べており、**URL を導出する場合**の制限である。RelayState を不透明トークンとして扱う実装、絶対 URL を一切受け付けない実装も適合するため、導出しない対象では NOT_APPLICABLE。★ 観測は方向付き: 対象が RelayState の値そのものへ user agent を遷移させたことだけが証拠になる"
  relaystate_privacy_required:
    kind: CLASSIFICATION_BASED
    description_ja: "この配備が RelayState のプライバシー保護を必要とするか"
    declared:
      - target.relaystate_privacy
    observed: []
    on_conflict: inconsistent
    declaration_only_exclusion:
      allowed: true
      requires_reason: true
      statement_en: "The deployment declared that the use of the profile does not require privacy measures for RelayState, as permitted by [SAML2Prof] section 4.1.3.1. This was not verified by the Suite."
    rationale_ja: "SAML2Prof 4.1.3.1 の『unless the use of the profile does not require such privacy measures』。原文が明示する適用除外だが、除外の根拠は配備側にしかないため申告でしか偽にできない。★ 既定は真。偽にするには理由付きの明示的な除外申告が要り、その Run は結果の最上位に除外として現れる"
  supports_unsolicited_responses:
    kind: CAPABILITY_BASED
    description_ja: "IdP が unsolicited <Response>（IdP-initiated SSO）を発行するか"
    declared:
      - declared_features.idp_initiated_sso
    observed:
      - "target_emitted_unsolicited_response: true"
    on_conflict: inconsistent
    rationale_ja: "SAML2Prof 4.1.5 の 'An identity provider MAY initiate this profile by delivering an unsolicited <Response> message'。★ 開始は MAY なので、発行しない IdP は違反ではなく NOT_APPLICABLE。unsolicited 固有の義務（InResponseTo を含めない・既定 ACS に配送する）はこの条件の下でのみ適用される。観測は方向付き: 対象が AuthnRequest なしに <Response> を送出したことだけが証拠になる"
  supports_slo_idp:
    kind: CAPABILITY_BASED
    description_ja: "IdP が SLO profile に対応しているか"
    declared:
      - declared_features.single_logout
    observed:
      - "target_metadata_has: md:IDPSSODescriptor/md:SingleLogoutService"
      - "target_emitted: samlp:LogoutRequest"
      - "target_consumed: samlp:LogoutRequest"
    on_conflict: inconsistent
    rationale_ja: "SAML2Prof 4.1.4.2（E26 反映）の 'If the identity provider supports the Single Logout profile ... any authentication statements MUST include a SessionIndex attribute'。★ IIP-IDP17 は IdP に SLO を MUST としているので適合 IdP では常に真になるが、義務の条件は原文どおり SLO 対応の有無に置く（IIP-IDP17 違反の対象で SessionIndex を二重に FAIL にしないため）"
  supports_artifact_binding:
    kind: CAPABILITY_BASED
    description_ja: "対象が HTTP Artifact バインディングに対応しているか"
    declared:
      - declared_features.artifact_binding
    observed:
      - "target_metadata_has: md:ArtifactResolutionService"
      - "target_emitted: samlp:ArtifactResolve"
      - "target_consumed: samlp:ArtifactResolve"
    on_conflict: inconsistent
    rationale_ja: "SAML2Prof 4.1.4.4 は 'If the HTTP Artifact binding is used to deliver the <Response>' が前提。IIP-SSO02 / SSO03 が要求するのは Redirect と POST だけなので、Artifact 非対応は違反ではなく NOT_APPLICABLE"
  supports_encrypted_nameid:
    kind: CAPABILITY_BASED
    description_ja: "対象が暗号化された名前識別子（saml:EncryptedID）を発行できるか"
    declared:
      - declared_features.encrypted_nameid
    observed:
      - "target_emitted: saml:EncryptedID"
    on_conflict: inconsistent
    rationale_ja: "SAML2Core 3.4.1.1 の Format=...:encrypted は結果の assertion に <EncryptedID> を要求する。ただし IIP-IDP09.b は識別子の暗号化を OPTIONAL としているため、非対応なら NOT_APPLICABLE。★ 観測は方向付き: 対象が *送信した* <EncryptedID> のみが証拠になる"
  reissues_foreign_persistent_identifier:
    kind: CAPABILITY_BASED
    description_ja: "対象が他エンティティ生成の persistent 識別子を再発行するか"
    declared:
      - declared_features.proxy_idp
    observed:
      - "target_reissued_upstream_persistent_nameid: true"
    on_conflict: inconsistent
    rationale_ja: "IIP-SSO05.a6 / .a7 の条件。SAML2Core 8.3.7 の再発行規則は『a different system entity might later issue its own protocol message or assertion containing the identifier』に該当する構成でのみ適用される。★ 観測は方向付き: 上流 Samlier-IdP が発行した NameID と同一の値を、対象が自身の Assertion で送出したことだけが証拠になる。対象が Proxy を名乗るだけでは能力の観測ではない"
