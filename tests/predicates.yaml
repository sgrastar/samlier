    on_conflict: inconsistent
    rationale_ja: "原文は 'If an implementation supports outbound encryption'。★ 観測は方向付きでなければならない: 対象が *送信した* 暗号要素のみが証拠になる。対象メタデータの KeyDescriptor use=encryption は『暗号文を受信・復号できる』証拠であって outbound 生成能力の証拠ではないため使わない"
  claims_slo_support_sp:
    kind: CLAIM_BASED
    description_ja: "SP が SLO profile への対応を表明しているか"
    declared:
